name: Build Flutter APK

on:
  push:
    # TEMP: claude/setup-claude-context-ZYkcp added to verify the Billing 8 +
    # target-API-36 toolchain build on the branch before promoting to main.
    # Revert to [main] only once CI is green.
    branches: [main, claude/setup-claude-context-ZYkcp]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.35.x required for compileSdk/targetSdk 36 (AGP 8.9.1 + Gradle
          # 8.11.1) and in_app_purchase_android 0.5.x, which carries Play
          # Billing Library 8 (Play Console mandates, both by 31 Aug 2026)
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Clean pub cache (resolve transitive dep conflicts)
        working-directory: flutter_app
        run: flutter clean && rm -f pubspec.lock

      - name: Generate launcher icons
        working-directory: flutter_app/android/app/src/main/res
        run: |
          python3 - <<'PYEOF'
          import struct, zlib, os

          def make_png(width, height, r, g, b):
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
              raw = b''.join(b'\x00' + bytes([r, g, b]) * width for _ in range(height))
              compressed = zlib.compress(raw, 9)
              png  = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', compressed)
              png += chunk(b'IEND', b'')
              return png

          GREEN = (6, 95, 70)   # #065F46 deep green
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
                   'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}

          for d, s in sizes.items():
              os.makedirs(d, exist_ok=True)
              data = make_png(s, s, *GREEN)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  with open(f'{d}/{name}', 'wb') as f:
                      f.write(data)
          print("Launcher icons generated ✅")
          PYEOF

      - name: Show release keystore fingerprint
        working-directory: flutter_app/android/app
        run: |
          keytool -list -v -keystore arthanote-release.keystore \
            -storepass "WYCLbtHArDji" 2>/dev/null \
            | grep -E "SHA1|SHA256" || true
          echo "✅ Using committed release keystore (consistent signing)"

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: flutter_app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee /tmp/flutter_build.log

      - name: Show build error (on failure)
        if: failure()
        run: |
          echo "========== FIRST 120 LINES (Dart errors appear here) =========="
          head -120 /tmp/flutter_build.log
          echo "========== GREP: error/Error/FAILURE/Exception =========="
          grep -iE "(error:|FAILURE:|What went wrong|Caused by:|Exception|cannot find)" /tmp/flutter_build.log | head -60
          echo "========== LAST 60 LINES =========="
          tail -60 /tmp/flutter_build.log

      - name: Build release AAB (Play Store)
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        # Non-fatal: the GitHub Release (below) is the real deliverable. If the
        # account's Actions artifact-storage quota is full this step may fail —
        # don't let that abort the job or skip the Release step.
        continue-on-error: true
        with:
          name: arthanote-apk-${{ github.sha }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "apk-${{ github.run_number }}"
          name: "ArthaNote v1.0 Build ${{ github.run_number }}"
          body: |
            ## ArthaNote Android App

            ### Download:
            - `app-arm64-v8a-release.apk` → **Modern phones** (64-bit) ← use this
            - `app-armeabi-v7a-release.apk` → Older phones (32-bit)
            - `app-release.aab` → Play Store upload

            ### Features:
            - Dashboard with sales/expense summary
            - Add entries (sale/expense/payment)
            - Ledger with search & filter
            - Supplier management
            - Reports with chart
            - Tamil/English toggle
            - Firebase sync
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
