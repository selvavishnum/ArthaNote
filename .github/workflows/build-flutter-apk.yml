name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Write google-services.json
        working-directory: flutter_app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB (Play Store)
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arthanote-apk-${{ github.sha }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "apk-${{ github.run_number }}"
          name: "ArthaNote v1.0 Build ${{ github.run_number }}"
          body: |
            ## ArthaNote Android App

            ### Download:
            - `app-arm64-v8a-release.apk` → **Modern phones** (64-bit) ← use this
            - `app-armeabi-v7a-release.apk` → Older phones (32-bit)
            - `app-release.aab` → Play Store upload

            ### Features:
            - Dashboard with sales/expense summary
            - Add entries (sale/expense/payment)
            - Ledger with search & filter
            - Supplier management
            - Reports with chart
            - Tamil/English toggle
            - Firebase sync
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
