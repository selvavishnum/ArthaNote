name: Build Admin APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Admin APK
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --release \
            --target=lib/main_admin.dart \
            --target-platform android-arm64 2>&1 | tee /tmp/admin_build.log
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/arthanote-admin-release.apk

      - name: Show build error (on failure)
        if: failure()
        run: |
          echo "========== FIRST 120 LINES =========="
          head -120 /tmp/admin_build.log
          echo "========== GREP errors =========="
          grep -iE "(error:|FAILURE:|Exception|cannot find)" /tmp/admin_build.log | head -40
          echo "========== LAST 60 LINES =========="
          tail -60 /tmp/admin_build.log

      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthanote-admin-apk-${{ github.sha }}
          path: flutter_app/build/app/outputs/flutter-apk/arthanote-admin-release.apk
          retention-days: 30

      - name: Create Admin GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "admin-${{ github.run_number }}"
          name: "ArthaNote Admin Build ${{ github.run_number }}"
          body: |
            ## ArthaNote Admin App

            ### Download:
            - `arthanote-admin-release.apk` → **Admin only** (arm64)

            ### Access:
            - Only `selvavishnu.m@gmail.com` can log in
            - Shows live user count, active users, per-user business details
            - Cache-first — once/day Firebase sync (50k read limit safe)
          files: |
            flutter_app/build/app/outputs/flutter-apk/arthanote-admin-release.apk
