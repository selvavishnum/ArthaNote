<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArthaNote POS — Admin</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════
   Clean-white minimalist back office. Deliberately single-theme: the
   brief was "clean white background", and a counter room is a fixed
   lighting environment. Every colour is painted explicitly so the page
   holds regardless of the host's own theme.
   ══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --page:#fafafa; --surface:#ffffff; --line:#ebebeb; --line-2:#f4f4f4;
  --ink:#111111; --ink-2:#5c5c5c; --ink-3:#9a9a9a;
  --accent:#059669; --accent-soft:#ecfdf5;
  --danger:#dc2626; --danger-soft:#fef2f2;
  --warn:#c2740a; --warn-soft:#fff7ed;
  --info:#2a78d6; --info-soft:#eff6ff;
  /* Chart roles — categorical slots 1-3 of the validated reference palette.
     Checked on #ffffff: all-pairs CVD ΔE 9.2, normal-vision 24.0. Slot 3 is
     2.82:1 against white, so every mark using it carries a visible direct
     label (the relief rule) and never relies on colour alone. */
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --bar:#059669; --grid:#f0f0f0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.ta{font-family:'Noto Sans Tamil',Inter,sans-serif}
.mono{font-family:'Roboto Mono',ui-monospace,monospace}
.tnum{font-variant-numeric:tabular-nums}
.scroll::-webkit-scrollbar{width:7px;height:7px}
.scroll::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:4px}
.scroll::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* ── shell ── */
.shell{display:flex;height:100%}
.side{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.brand b{display:block;font-size:13px;font-weight:700;line-height:1.2}
.brand span{display:block;font-size:11px;color:var(--ink-3)}
.nav{padding:6px;overflow-y:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:0 10px;height:36px;border-radius:7px;color:var(--ink-2);font-size:13.5px;font-weight:500;width:100%;border:0;background:none;text-align:left}
.nav-item:hover{background:var(--line-2);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item .chev{margin-left:auto;width:13px;height:13px;transition:transform .15s;color:var(--ink-3)}
.nav-item.open .chev{transform:rotate(90deg)}
.nav-kids{overflow:hidden;padding-left:8px;margin-left:15px;border-left:1px solid var(--line)}
.nav-kid{display:block;width:100%;border:0;background:none;text-align:left;padding:0 10px;height:31px;line-height:31px;border-radius:6px;color:var(--ink-2);font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-kid:hover{background:var(--line-2);color:var(--ink)}
.nav-kid.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{padding:10px;border-top:1px solid var(--line);flex-shrink:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{height:58px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
.burger{display:none;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);place-items:center;flex-shrink:0}
.top h1{font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:11.5px;color:var(--ink-3);margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow-y:auto;padding:18px}
.wrap{max-width:1200px;margin:0 auto}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.scrim.on{display:block}

/* ── primitives ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-hd{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-hd h3{margin:0;font-size:14px;font-weight:700}
.card-hd .note{font-size:11.5px;color:var(--ink-3);font-weight:500}
.card-b{padding:15px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.kpi .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:800;background:#fcfcfc}
tr.click{cursor:pointer}
tr.click:hover td{background:#fcfcfc}
.tw{overflow-x:auto}
.num{text-align:right}

.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--line-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#047857}
.btn-d{color:var(--danger);border-color:#f3d5d5}
.btn-d:hover{background:var(--danger-soft)}
.btn svg{width:14px;height:14px}
.btn-xs{height:27px;padding:0 9px;font-size:11.5px;border-radius:6px}
.inp{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{height:auto;padding:8px 10px;min-height:64px;resize:vertical}
.seg{display:inline-flex;background:var(--line-2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{height:28px;padding:0 11px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.empty{padding:38px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.toolbar{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap;align-items:center}

/* ── charts ── */
/* The y-axis has its own right gutter: labels positioned inside the plot get
   painted over by the bars, which are drawn after the gridlines. */
.plot{position:relative;height:186px;padding-right:46px}
.bars{display:flex;align-items:flex-end;gap:2px;height:100%;padding-top:6px}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar{width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px;transition:opacity .12s}
.bar-col:hover .bar{opacity:.72}
.xaxis{display:flex;gap:2px;margin-top:7px;padding-right:46px;font-size:10px;color:var(--ink-3)}
.xaxis span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden}
.gridline{position:absolute;left:0;right:46px;border-top:1px solid var(--grid);font-size:10px;color:var(--ink-3)}
.gridline b{position:absolute;left:100%;top:-8px;padding-left:7px;font-weight:500;white-space:nowrap}
.tip{position:fixed;z-index:90;background:#111;color:#fff;font-size:11.5px;padding:7px 10px;border-radius:7px;pointer-events:none;display:none;white-space:nowrap;line-height:1.45}
.hbar-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.hbar-lab{width:110px;flex-shrink:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{flex:1;height:14px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px}
.hbar-val{width:96px;text-align:right;font-size:12.5px;font-weight:700;flex-shrink:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:9px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

/* ── order pipeline ── */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px;text-align:left;transition:border-color .12s}
.stage:hover{border-color:var(--accent)}
.stage.on{border-color:var(--accent);background:var(--accent-soft)}
.stage .n{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.stage .c{font-size:23px;font-weight:800;margin-top:3px;line-height:1}
.stage .lab{font-size:12.5px;font-weight:600;margin-top:1px}

/* ── modal ── */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal-in{background:var(--surface);border-radius:12px;width:100%;max-width:520px;max-height:100%;overflow-y:auto;padding:20px}
.modal-in h3{margin:0 0 14px;font-size:16px;font-weight:700}
.fl{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:4px}
.fg{margin-bottom:11px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;z-index:95;display:none}

/* barcode */
.bc{display:inline-block;background:#fff;padding:10px;border:1px solid var(--line);border-radius:8px;text-align:center}
.bc-bars{display:flex;align-items:flex-end;height:52px;gap:0}
.bc-bars i{display:block;height:100%;background:#000}
.bc-txt{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:2px;margin-top:5px}

@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:860px){
  .side{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.16)}
  .burger{display:grid}
  .g2,.g4{grid-template-columns:1fr}
  .body{padding:13px}
  .frow{grid-template-columns:1fr}
  .hbar-lab{width:80px}.hbar-val{width:78px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">🥬</div>
      <div><b>Tulasi Mart</b><span>ArthaNote Admin</span></div>
    </div>
    <nav class="nav scroll" id="nav"></nav>
    <div class="side-foot">
      <a href="pos.html" class="btn" style="width:100%;justify-content:center;text-decoration:none"><i data-i="calculator"></i>Open Billing</a>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="closeSide()"></div>

  <div class="main">
    <header class="top">
      <button class="burger" onclick="toggleSide()" aria-label="Menu"><i data-i="menu"></i></button>
      <div style="min-width:0">
        <h1 id="pg-title">Dashboard</h1>
        <div class="sub" id="pg-sub"></div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:9px;flex-shrink:0">
        <span class="pill ok" id="src-pill">demo</span>
        <span style="font-size:12.5px;font-weight:600" class="tnum" id="today"></span>
      </div>
    </header>
    <div class="body scroll"><div class="wrap" id="view"></div></div>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-in" id="modal-in"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   ArthaNote POS Admin — back office

   Reads the same browser database pos.html writes (anpos_v1), so a bill
   taken at the counter appears here with no sync step.

   Two structural ideas carry this file:

   1. ROLLUPS. A 90-day report must never be built by reading 90 days of
      bills — at 150 bills/day that is 13,500 documents for one screen.
      Each day is collapsed once into one summary document and reports read
      those. The same trick works unchanged on Firestore, Postgres or
      DynamoDB, which is why the data model matters more than the database.

   2. A SCHEMA-DRIVEN CRUD ENGINE. Most of the ~70 screens in this admin are
      the same thing: a searchable list of records you can add, edit and
      delete. Writing 70 of those by hand would be 70 places for the same
      bug. Each entity declares its fields once in SCHEMA and one renderer
      builds the list, the form, validation and persistence for all of them.
      Only screens whose behaviour genuinely differs — the 15 reports, the
      9-stage order pipeline, the barcode tool, the stock checker — are
      written out by hand.
   ══════════════════════════════════════════════════════════════════════ */

const LS='anpos_v1', LS_ROLL='anpos_v1_rollups';
let DB, ROLL={}, page='dashboard', range=30, openGroups={}, orderStage='all', reportKey='r1';

/* ═════════ ICONS (inlined — a shop's internet is the least reliable thing
   in the building, and nav that loses its icons to a CDN outage is a bad
   trade for ~2KB) ═════════ */
const ICONS={
'layout-dashboard':'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
'bar-chart-3':'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
'warehouse':'<path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35a2 2 0 0 1 1.26-1.86l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12v-8H6z"/>',
'truck':'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
'clipboard-list':'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
'shopping-cart':'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L22 7H5"/>',
'package':'<path d="m7.5 4.3 9 5.1"/><path d="M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
'contact':'<path d="M17 18a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2"/><rect x="3" y="4" width="18" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 2v2"/><path d="M16 2v2"/>',
'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
'git-branch':'<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
'wallet':'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v3"/><path d="M3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
'settings':'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
'menu':'<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>',
'calculator':'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14v4M8 18h.01M12 18h.01"/>',
'plus':'<path d="M5 12h14"/><path d="M12 5v14"/>',
'download':'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
'refresh-cw':'<path d="M3 12a9 9 0 0 1 15.7-6L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.7 6L3 16"/><path d="M8 16H3v5"/>',
'trash-2':'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/>',
'zap':'<path d="M4 14h7l-1 8 10-12h-7l1-8z"/>',
'chevron-right':'<path d="m9 18 6-6-6-6"/>',
'pencil':'<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
'search':'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
'barcode':'<path d="M3 5v14M6 5v14M10 5v14M13 5v9M17 5v14M21 5v14"/>',
'arrow-right':'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
};
function icons(root){
  (root||document).querySelectorAll('i[data-i]').forEach(el=>{
    const p=ICONS[el.getAttribute('data-i')];
    if(!p){ el.remove(); return; }
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
    s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2');
    s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
    s.setAttribute('aria-hidden','true');
    if(el.className) s.setAttribute('class', el.className);
    if(el.getAttribute('style')) s.setAttribute('style', el.getAttribute('style'));
    s.innerHTML=p; el.replaceWith(s);
  });
}

/* ═════════ helpers ═════════ */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const money2=n=>'₹'+(Math.round(((n||0)+Number.EPSILON)*100)/100).toFixed(2);

function seedBills(){
  const bills=[]; let seq=1;
  for(let d=6;d>=0;d--){
    const day=new Date(); day.setDate(day.getDate()-d);
    const dow=day.getDay();
    const n=34+(dow===0?26:dow===6?18:0)+((d*13)%11);
    for(let b=0;b<n;b++){
      const items=[]; const lines=1+((b*7+d*3)%5);
      for(let k=0;k<lines;k++){
        const p=pick(P,b*3+k*5+d);
        const qty=p[4]==='kg'?+(0.25*(1+((b+k)%6))).toFixed(3):1+((b+k)%3);
        items.push({name:p[1],nameTa:p[2],unit:p[4],rate:p[6],qty,sku:p[0]});
      }
      const sub=+items.reduce((a,i)=>a+i.rate*i.qty,0).toFixed(2);
      const m=(b%10===0)?'card':(b%3===0)?'upi':'cash';
      const t=new Date(day); t.setHours(6+((b*7)%15),(b*13)%60,0,0);
      const cust=b%7===0?['Ramesh Anna','Hotel Sai Sree','Lakshmi Akka','Murugan Mess'][b%4]:'';
      bills.push({id:'b'+d+'_'+b,billNo:'T1-'+String(seq++).padStart(5,'0'),ts:t.getTime(),date:iso(day),
        cashier:'Cashier '+(1+(b%2)),mode:b%9===0?'Delivery':b%5===0?'Take-Away':'InStore',customer:cust,
        items,subtotal:sub,discount:0,discType:'pct',discVal:0,gst:0,gstRate:0,total:sub,
        payment:m==='cash'?{method:'cash',tendered:Math.ceil(sub/10)*10,change:+(Math.ceil(sub/10)*10-sub).toFixed(2)}:{method:m,ref:'REF'+(10000+b)}});
    }
  }
  return bills;
}

/* ═════════ storage ═════════ */
function load(){
  try{ DB=JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ DB=null; }
  if(!DB||!DB.products||!DB.staff||!DB.orders) DB=Object.assign(seedDB(),DB||{});
  // Any collection a newer build introduces is backfilled rather than left undefined
  const fresh=seedDB();
  Object.keys(fresh).forEach(k=>{ if(DB[k]===undefined) DB[k]=fresh[k]; });
  save(); loadRollups();
}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){ toast('Storage full — export and reset'); } }
function saveRollups(){ try{ localStorage.setItem(LS_ROLL,JSON.stringify(ROLL)); }catch(e){} }

/* ═════════ rollups ═════════ */
function loadRollups(){
  try{ ROLL=JSON.parse(localStorage.getItem(LS_ROLL)||'null')||{}; }catch(e){ ROLL={}; }
  const byDate={};
  DB.bills.forEach(b=>{ (byDate[b.date]=byDate[b.date]||[]).push(b); });
  Object.entries(byDate).forEach(([d,l])=>{ ROLL[d]=rollupFrom(d,l); });
  for(let i=0;i<90;i++){ const dt=new Date(); dt.setDate(dt.getDate()-i); const d=iso(dt);
    if(!ROLL[d]) ROLL[d]=synthRollup(d,dt); }
  saveRollups();
}
function rollupFrom(date,list){
  const r={date,bills:list.length,sales:0,cash:0,upi:0,card:0,items:{},synth:false};
  list.forEach(b=>{
    r.sales+=b.total; const m=b.payment.method;
    if(m==='cash')r.cash+=b.total; else if(m==='upi')r.upi+=b.total; else if(m==='card')r.card+=b.total;
    else {r.cash+=b.payment.cash||0;r.upi+=b.payment.upi||0;}
    b.items.forEach(i=>{ const k=i.sku||i.name;
      const e=r.items[k]=r.items[k]||{name:i.name,qty:0,amt:0}; e.qty+=i.qty; e.amt+=i.rate*i.qty; });
  });
  ['sales','cash','upi','card'].forEach(k=>r[k]=+r[k].toFixed(2));
  return r;
}
function synthRollup(d,dt){
  const dow=dt.getDay(),n=dt.getDate(),mo=dt.getMonth(),seed=(n*37+mo*101+dow*17)%100;
  const bills=Math.max(12,30+(dow===0?24:dow===6?16:dow===1?-6:0)+(seed%13));
  const sales=+(bills*(210+(seed%70))).toFixed(2);
  const cash=+(sales*(0.52+((seed%9)/100))).toFixed(2), card=+(sales*(0.06+((seed%4)/100))).toFixed(2);
  const items={};
  P.forEach((p,i)=>{ if((seed+i)%4===0)return; const q=+(((seed+i*7)%40)+4).toFixed(2);
    items[p[0]]={name:p[1],qty:q,amt:+(q*p[6]).toFixed(2)}; });
  return {date:d,bills,sales,cash,upi:+(sales-cash-card).toFixed(2),card,items,synth:true};
}
function rollupRange(days){
  const out=[];
  for(let i=days-1;i>=0;i--){ const dt=new Date(); dt.setDate(dt.getDate()-i); const d=iso(dt);
    out.push(ROLL[d]||{date:d,bills:0,sales:0,cash:0,upi:0,card:0,items:{},synth:true}); }
  return out;
}

/* ═════════ charts ═════════ */
function barChart(rows,key,labelFn,fmtFn){
  const max=Math.max(...rows.map(r=>r[key]),1), step=niceStep(max), lines=[];
  for(let v=step;v<=max*1.02;v+=step) lines.push(v);
  const every=Math.ceil(rows.length/(window.innerWidth<700?6:12));
  return `<div class="plot">
    ${lines.map(v=>`<div class="gridline" style="bottom:${(v/max*100)*0.94}%"><b>${compact(v)}</b></div>`).join('')}
    <div class="bars">${rows.map(r=>`<div class="bar-col" onmousemove="showTip(event,'${esc(labelFn(r))}','${esc(fmtFn(r))}')" onmouseleave="hideTip()">
      <div class="bar" style="height:${Math.max(r[key]/max*94,r[key]>0?1.2:0)}%"></div></div>`).join('')}</div>
  </div><div class="xaxis">${rows.map((r,i)=>`<span>${i%every===0?dshort(r.date):''}</span>`).join('')}</div>`;
}
function niceStep(max){const raw=max/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;}
/* Every horizontal bar carries a direct value label — required relief for any
   series below 3:1 contrast on white, and useful on the rest regardless. */
function hBars(rows,color){
  const max=Math.max(...rows.map(r=>r.v),1);
  return rows.map(r=>`<div class="hbar-row"><div class="hbar-lab" title="${esc(r.k)}">${esc(r.k)}</div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(r.v/max*100,0)}%;background:${r.c||color||'var(--bar)'}"></div></div>
    <div class="hbar-val tnum">${r.lab}</div></div>`).join('');
}
function showTip(e,a,b){const t=document.getElementById('tip');t.innerHTML='<b>'+a+'</b><br>'+b;t.style.display='block';
  const w=t.offsetWidth,x=Math.min(Math.max(e.clientX-w/2,8),innerWidth-w-8);t.style.left=x+'px';t.style.top=(e.clientY-t.offsetHeight-12)+'px';}
function hideTip(){document.getElementById('tip').style.display='none';}

   GENERIC CRUD — one implementation for ~40 screens
   ══════════════════════════════════════════════════════════════════════ */
let crudQ='';
function renderCrud(key){
  const s=SCHEMA[key], rows=DB[s.c]||[];
  sub(rows.length+' record'+(rows.length===1?'':'s'));
  V(`<div class="toolbar">
      <input class="inp" id="crud-q" placeholder="Search ${esc(s.t).toLowerCase()}…" style="max-width:280px" value="${esc(crudQ)}" oninput="crudQ=this.value;drawCrud('${key}')">
      <button class="btn" onclick="exportCrud('${key}')"><i data-i="download"></i>CSV</button>
      <button class="btn btn-p" style="margin-left:auto" onclick="crudForm('${key}')"><i data-i="plus"></i>Add</button>
    </div><div id="crud-body"></div>`);
  drawCrud(key);
}
function crudMatch(row,q){
  if(!q) return true; q=q.toLowerCase();
  return Object.values(row).some(v=>String(v==null?'':v).toLowerCase().includes(q));
}
function fmtCell(f,v){
  if(v===undefined||v===null||v==='') return '<span style="color:var(--ink-3)">—</span>';
  if(f.t==='money') return money2(v);
  if(f.t==='num')   return Number(v).toLocaleString('en-IN');
  if(f.t==='date')  return dlong(v);
  const s=String(v);
  if(f.t==='select'){
    const bad=/^(Overdue|Rejected|Blocked|High|Disabled|Absent|Unreconciled|Open)$/i.test(s);
    const ok=/^(Approved|Done|Paid|Active|Yes|Resolved|Matched|Closed|Settled|Received|Present|Passed)$/i.test(s);
    const wn=/^(Pending|In progress|Due soon|Medium|Half day|Planning|To do|Extended|Converted)$/i.test(s);
    return `<span class="pill ${ok?'ok':bad?'bad':wn?'warn':''}">${esc(s)}</span>`;
  }
  return esc(s);
}
function drawCrud(key){
  const s=SCHEMA[key];
  const rows=(DB[s.c]||[]).filter(r=>crudMatch(r,crudQ));
  const cols=s.f.slice(0,8);
  document.getElementById('crud-body').innerHTML=`<div class="card"><div class="tw"><table>
    <thead><tr>${cols.map(f=>`<th class="${f.t==='money'||f.t==='num'?'num':''}">${esc(f.l)}</th>`).join('')}<th style="width:86px"></th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr>
      ${cols.map(f=>`<td class="${f.t==='money'||f.t==='num'?'num tnum':''}">${fmtCell(f,r[f.k])}</td>`).join('')}
      <td style="white-space:nowrap">
        <button class="btn btn-xs" onclick="crudForm('${key}','${r.id}')" aria-label="Edit"><i data-i="pencil"></i></button>
        <button class="btn btn-xs btn-d" onclick="crudDel('${key}','${r.id}')" aria-label="Delete"><i data-i="trash-2"></i></button>
      </td></tr>`).join(''):`<tr><td colspan="${cols.length+1}"><div class="empty">${crudQ?'Nothing matches “'+esc(crudQ)+'”.':'No records yet — use <b>Add</b>.'}</div></td></tr>`}
    </tbody></table></div></div>`;
  icons(document.getElementById('crud-body'));
  sub(rows.length+' of '+(DB[s.c]||[]).length+' record'+((DB[s.c]||[]).length===1?'':'s'));
}
function crudForm(key,id){
  const s=SCHEMA[key];
  const r=id?(DB[s.c]||[]).find(x=>x.id===id):{};
  if(id&&!r) return toast('Record not found');
  modal(`<h3>${id?'Edit':'Add'} — ${esc(s.t)}</h3>
    <div class="frow">${s.f.map(f=>{
      const v=r[f.k]===undefined?'':r[f.k];
      const wide=f.t==='textarea'||f.l.length>18;
      let ctl;
      if(f.t==='select') ctl=`<select class="inp" id="cf-${f.k}">${f.opts.map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
      else if(f.t==='textarea') ctl=`<textarea class="inp" id="cf-${f.k}">${esc(v)}</textarea>`;
      else ctl=`<input class="inp ${f.t==='money'||f.t==='num'?'tnum':''}" id="cf-${f.k}" type="${f.t==='date'?'date':f.t==='num'||f.t==='money'?'number':'text'}" ${f.t==='money'?'step="0.01"':''} value="${esc(v)}">`;
      return `<div class="fg" style="${wide?'grid-column:1/-1':''}"><label class="fl" for="cf-${f.k}">${esc(f.l)}${f.req?' *':''}</label>${ctl}</div>`;
    }).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn" style="flex:1;justify-content:center" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" style="flex:1;justify-content:center" onclick="crudSave('${key}','${id||''}')">Save</button>
    </div>`);
  const first=document.getElementById('cf-'+s.f[0].k); if(first) first.focus();
}
function crudSave(key,id){
  const s=SCHEMA[key], o={};
  for(const f of s.f){
    let v=val('cf-'+f.k);
    if(f.req&&!v) return toast('“'+f.l+'” is required');
    if(f.t==='num'||f.t==='money') v=v===''?0:Number(v);
    o[f.k]=v;
  }
  DB[s.c]=DB[s.c]||[];
  if(id){ const r=DB[s.c].find(x=>x.id===id); if(!r) return toast('Record not found'); Object.assign(r,o); }
  else DB[s.c].unshift(Object.assign({id:uid('x')},o));
  save(); closeModal(); drawCrud(key); toast(id?'Updated':'Added');
}
function crudDel(key,id){
  const s=SCHEMA[key];
  const r=(DB[s.c]||[]).find(x=>x.id===id); if(!r) return;
  const label=r[s.f[0].k]||'this record';
  if(!confirm('Delete “'+label+'”? This cannot be undone.')) return;
  DB[s.c]=DB[s.c].filter(x=>x.id!==id);
  save(); drawCrud(key); toast('Deleted');
}
function exportCrud(key){
  const s=SCHEMA[key], rows=(DB[s.c]||[]).filter(r=>crudMatch(r,crudQ));
  const head=s.f.map(f=>f.l).join(',');
  const body=rows.map(r=>s.f.map(f=>{const v=r[f.k]==null?'':String(r[f.k]);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
  dl(head+'\n'+body,'text/csv',key+'.csv'); toast('CSV exported');
}
function dl(content,type,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

/* ══════════════════════════════════════════════════════════════════════
   ORDERS — 9-stage pipeline. Orders genuinely move between stages, so this
   is not a CRUD list: advancing one is the primary action.
   ══════════════════════════════════════════════════════════════════════ */
const STAGES=['New','Prepare','Package','Ship','Delivery','Payment','Closed'];
function routeOrders(k){
  const which=k.slice(4);
  if(which==='dash'){ title('Orders — Dashboard'); ordDash(); }
  else { orderStage=which; title('Orders — '+which); ordList(which); }
  icons(document.getElementById('view')); scrollTop();
}
const stageCount=s=>DB.orders.filter(o=>o.stage===s).length;
function ordDash(){
  const total=DB.orders.length;
  sub(total+' orders in the pipeline');
  V(`<div class="pipe" style="margin-bottom:14px">
      ${STAGES.map((s,i)=>`<button class="stage" onclick="go('ord-${s}')">
        <div class="n">${i+1}</div><div class="c tnum">${stageCount(s)}</div><div class="lab">${s}</div></button>`).join('')}
      <button class="stage" onclick="go('ord-History')"><div class="n">8</div><div class="c tnum">${total}</div><div class="lab">History</div></button>
      <button class="stage" onclick="go('ord-Returns')"><div class="n">9</div><div class="c tnum" style="color:var(--danger)">${stageCount('Returns')}</div><div class="lab">Returns</div></button>
    </div>
    <div class="card"><div class="card-hd"><h3>Orders needing attention</h3><span class="note">anything not Closed or Returned</span></div>
    ${ordTable(DB.orders.filter(o=>o.stage!=='Closed'&&o.stage!=='Returns'))}</div>`);
}
function ordList(stage){
  let rows;
  if(stage==='History') rows=DB.orders;
  else rows=DB.orders.filter(o=>o.stage===stage);
  sub(rows.length+' order'+(rows.length===1?'':'s'));
  V(`<div class="toolbar">
      <div class="seg">${['dash'].concat(STAGES,['Returns','History']).map(s=>
        `<button class="${(s==='dash'?false:s===stage)?'on':''}" onclick="go('ord-${s}')">${s==='dash'?'Dashboard':s}</button>`).join('')}</div>
    </div>${ordTable(rows,stage)}`);
}
function ordTable(rows,stage){
  return `<div class="card"><div class="tw"><table>
    <thead><tr><th>SO No</th><th>Date</th><th>Customer</th><th>Product</th><th class="num">Qty</th><th class="num">Amount</th><th>Channel</th><th>Stage</th><th style="width:120px"></th></tr></thead>
    <tbody>${rows.length?rows.map(o=>{
      const nxt=STAGES[STAGES.indexOf(o.stage)+1];
      return `<tr>
        <td class="mono" style="font-size:12.5px"><b>${esc(o.so)}</b></td>
        <td class="tnum" style="color:var(--ink-2);font-size:12.5px">${dshort(o.date)}</td>
        <td><b>${esc(o.customer)}</b><div style="font-size:11px;color:var(--ink-3)" class="mono">${esc(o.phone||'')}</div></td>
        <td>${esc(o.product)}</td>
        <td class="num tnum">${o.qty}</td>
        <td class="num tnum"><b>${money(o.amount)}</b></td>
        <td><span class="pill">${esc(o.channel)}</span></td>
        <td><span class="pill ${o.stage==='Closed'?'ok':o.stage==='Returns'?'bad':'warn'}">${esc(o.stage)}</span></td>
        <td style="white-space:nowrap">
          ${nxt?`<button class="btn btn-xs" onclick="advance('${o.id}')" title="Move to ${nxt}">${nxt}<i data-i="arrow-right"></i></button>`:''}
          ${o.stage!=='Returns'?`<button class="btn btn-xs btn-d" onclick="markReturn('${o.id}')">Return</button>`:''}
        </td></tr>`;}).join('')
      :`<tr><td colspan="9"><div class="empty">No orders in ${esc(stage||'this stage')}.</div></td></tr>`}
    </tbody></table></div></div>`;
}
function advance(id){
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  const i=STAGES.indexOf(o.stage);
  if(i<0||i>=STAGES.length-1) return toast('Already at the last stage');
  o.stage=STAGES[i+1]; save(); go(page); toast(o.so+' → '+o.stage);
}
function markReturn(id){
  const o=DB.orders.find(x=>x.id===id); if(!o) return;
  if(!confirm('Mark '+o.so+' as returned?')) return;
  o.stage='Returns'; save(); go(page); toast(o.so+' marked returned');
}

/* ══════════════════════════════════════════════════════════════════════
   REPORTS — 15 report types over one generic table renderer.
   Every one of them is built from daily rollups or master data, never by
   scanning raw bills.
   ══════════════════════════════════════════════════════════════════════ */
const REPORTS=[
 ['r1','1. Sales by Product',            repSalesByProduct],
 ['r2','2. Sales by Category',           repSalesByCategory],
 ['r3','3. Sales by Order',              repSalesByOrder],
 ['r4','4. Top Selling Products',        repTopSelling],
 ['r5','5. Top Purchasing Customers',    repTopCustomers],
 ['r6','6. Products Purchase Summary — by Product', repPurchByProduct],
 ['r7','7. Product Purchase Order (PO) Summary',    repPOSummary],
 ['r8','8. RawMaterial Purchase Summary — by Material', repRawByMaterial],
 ['r9','9. RawMaterials Purchase Order (PO) Summary',   repRawPO],
 ['r10','10. Sales Report (GST) — Detailed',  repSalesGst],
 ['r11','11. Purchases Report (GST) — Detailed', repPurchGst],
 ['r12','12. Sales & Purchases Summary',  repSalesVsPurch],
 ['r13','13. Account Ledger Book — Detailed', repLedgerDetail],
 ['r14','14. Account Ledger — Summary',   repLedgerSummary],
 ['r15','15. Product — Price List',       repPriceList],
];
function pgReports(){
  const rows=rollupRange(range);

  sub(range+'-day window · '+rows.length+' rollup reads');
  const rep=REPORTS.find(r=>r[0]===reportKey)||REPORTS[0];
  const out=rep[2](rows);
  V(`<div class="toolbar">
      <select class="inp" style="max-width:340px" onchange="reportKey=this.value;pgReports();icons(document.getElementById('view'))">
        ${REPORTS.map(r=>`<option value="${r[0]}" ${r[0]===reportKey?'selected':''}>${esc(r[1])}</option>`).join('')}
      </select>
      <div class="seg">${[7,30,60,90].map(d=>`<button class="${range===d?'on':''}" onclick="range=${d};pgReports();icons(document.getElementById('view'))">${d}d</button>`).join('')}</div>
      <button class="btn" style="margin-left:auto" onclick="exportReport()"><i data-i="download"></i>CSV</button>
    </div>

    <div class="card" style="margin-bottom:13px;border-color:#d7efe4;background:var(--accent-soft)">
      <div class="card-b" style="display:flex;gap:14px;align-items:flex-start">
        <i data-i="zap" style="width:19px;height:19px;color:var(--accent);flex-shrink:0;margin-top:2px"></i>
        <div style="font-size:12.5px;color:var(--ink-2)">
          <b style="color:var(--ink);font-size:13.5px">Read ${rows.length} summary documents, not ${bills.toLocaleString('en-IN')} bills.</b><br>
          Every report on this page is built from one rollup document per day. Scanning the raw bills instead would be
          <b class="tnum">${bills?Math.round(bills/rows.length):0}×</b> the work for the same numbers, and that ratio grows every day the shop trades.
        </div>
      </div>
    </div>

    <div class="card"><div class="card-hd"><h3>${esc(rep[1])}</h3><span class="note">${esc(out.note||'')}</span></div>
      ${repTable(out)}</div>`);
  _lastReport=out; _lastReportName=rep[1];
}
let _lastReport=null,_lastReportName='';
function repTable(o){
  if(!o.rows.length) return '<div class="empty">No data in this window.</div>';
  return `<div class="tw"><table>
    <thead><tr>${o.cols.map((c,i)=>`<th class="${o.num&&o.num.includes(i)?'num':''}">${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${o.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${o.num&&o.num.includes(i)?'num tnum':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
    ${o.total?`<tfoot><tr>${o.total.map((c,i)=>`<td class="${o.num&&o.num.includes(i)?'num tnum':''}">${c}</td>`).join('')}</tr></tfoot>`:''}
  </table></div>`;
}
function exportReport(){
  if(!_lastReport) return;
  const rip=s=>String(s).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim();
  const lines=[_lastReport.cols.join(',')].concat(_lastReport.rows.map(r=>r.map(c=>{
    const v=rip(c); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')));
  if(_lastReport.total) lines.push(_lastReport.total.map(c=>rip(c)).join(','));
  dl(lines.join('\n'),'text/csv',_lastReportName.replace(/[^\w]+/g,'-').toLowerCase()+'.csv');
  toast('CSV exported');
}
/* aggregate SKU → {qty, amt} across a rollup range */
function aggItems(rows){
  const agg={};
  rows.forEach(r=>Object.entries(r.items||{}).forEach(([sku,v])=>{
    const e=agg[sku]=agg[sku]||{sku,name:v.name,qty:0,amt:0}; e.qty+=v.qty; e.amt+=v.amt; }));
  return Object.values(agg);
}
function repSalesByProduct(rows){
  const a=aggItems(rows).sort((x,y)=>y.amt-x.amt);
  const tq=a.reduce((s,x)=>s+x.qty,0), ta=a.reduce((s,x)=>s+x.amt,0);
  return {cols:['SKU','Product','தமிழ்','Qty','Value','% of sales'],num:[3,4,5],
    note:'from '+rows.length+' daily rollups',
    rows:a.map(x=>{const p=DB.products.find(p=>p.sku===x.sku);
      return ['<span class="mono" style="font-size:12px">'+esc(x.sku)+'</span>','<b>'+esc(x.name)+'</b>',
        '<span class="ta" style="color:var(--ink-2)">'+esc(p?p.nameTa:'—')+'</span>',
        x.qty.toFixed(2),money(x.amt),(ta?x.amt/ta*100:0).toFixed(1)+'%'];}),
    total:['','<b>Total</b>','',tq.toFixed(2),money(ta),'100%']};
}
function repSalesByCategory(rows){
  const a=aggItems(rows), by={};
  a.forEach(x=>{const p=DB.products.find(p=>p.sku===x.sku);const c=p?p.category:'Uncategorised';
    const e=by[c]=by[c]||{qty:0,amt:0,n:0}; e.qty+=x.qty; e.amt+=x.amt; e.n++;});
  const list=Object.entries(by).sort((x,y)=>y[1].amt-x[1].amt);
  const ta=list.reduce((s,[,v])=>s+v.amt,0);
  return {cols:['Category','SKUs','Qty','Value','% of sales'],num:[1,2,3,4],
    rows:list.map(([c,v])=>['<b>'+esc(c)+'</b>',v.n,v.qty.toFixed(2),money(v.amt),(ta?v.amt/ta*100:0).toFixed(1)+'%']),

function repSalesByOrder(rows){

}
function repTopSelling(rows){

function repTopCustomers(rows){

function pgBarcode(){

  V(`<div class="card" style="max-width:640px;margin-bottom:13px"><div class="card-b">

function drawBarcode(){
  const p=DB.products.find(x=>x.id===document.getElementById('bc-p').value)||DB.products[0];
  const n=Math.min(Math.max(parseInt(document.getElementById('bc-n').value)||1,1),40);
  const code=(p.barcode||p.sku);
  // Deterministic bar widths derived from the code's own characters
  let bars='';
  for(let i=0;i<code.length;i++){
    const c=code.charCodeAt(i);
    for(let b=0;b<4;b++){
      const wide=((c>>b)&1)===1;
      bars+=`<i style="width:${wide?3:1.4}px"></i><i style="width:${wide?1.4:3}px;background:#fff"></i>`;
    }
  }
  document.getElementById('bc-out').innerHTML=`<div class="card"><div class="card-b">
    <div style="display:flex;flex-wrap:wrap;gap:11px">
      ${Array.from({length:n},()=>`<div class="bc">
        <div style="font-size:11px;font-weight:700">${esc(p.nameEn)}</div>
        <div class="ta" style="font-size:10px;color:#444">${esc(p.nameTa)}</div>
        <div class="bc-bars">${bars}</div>
        <div class="bc-txt">${esc(code)}</div>
        <div style="font-size:12px;font-weight:800;margin-top:2px">₹${p.price} / ${esc(p.unit)}</div>
      </div>`).join('')}
    </div></div></div>`;
}

      <div class="card"><div class="card-hd"><h3>Tax</h3></div><div class="card-b">
        <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:12px">
          <span><b>Charge GST on bills</b><div style="font-size:12.5px;color:var(--ink-3)">Applies at the counter and in report 10</div></span>
          <input type="checkbox" ${s.gstOn?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)" onchange="DB.settings.gstOn=this.checked;save();toast('Saved')"></label>
        <div class="fg"><label class="fl">GST rate %</label><input class="inp tnum" type="number" value="${s.gstRate}" onchange="DB.settings.gstRate=+this.value||0;save();toast('Saved')"></div>
        <div style="font-size:12.5px;color:var(--ink-2)">Slabs are maintained under <a href="#" onclick="go('set-tax');return false">Taxes</a>.</div>
      </div></div>
    </div>
    <div class="card" style="margin-top:13px"><div class="card-hd"><h3>Data</h3></div><div class="card-b">
      <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:12px">
        This admin reads the same browser database the billing terminal writes (<span class="mono">anpos_v1</span>). Nothing leaves this device yet —
        wiring it to Firestore is the next layer, and it should write <b>batched daily rollups</b>, not one document per bill.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="exportAll()"><i data-i="download"></i>Export JSON</button>
        <button class="btn" onclick="rebuild()"><i data-i="refresh-cw"></i>Rebuild rollups</button>
        <button class="btn btn-d" onclick="resetAll()"><i data-i="trash-2"></i>Reset demo</button>
      </div>
      <table style="max-width:460px;margin-top:14px"><tbody>
        <tr><td style="padding:6px 0">Raw bills held</td><td class="num tnum"><b>${DB.bills.length.toLocaleString('en-IN')}</b></td></tr>
        <tr><td style="padding:6px 0">Daily rollups</td><td class="num tnum"><b>${Object.keys(ROLL).length}</b></td></tr>
        <tr><td style="padding:6px 0">Collections</td><td class="num tnum">${Object.keys(DB).filter(k=>Array.isArray(DB[k])).length}</td></tr>
        <tr><td style="padding:6px 0">localStorage used</td><td class="num tnum">${((JSON.stringify(DB).length+JSON.stringify(ROLL).length)/1024).toFixed(0)} KB</td></tr>
      </tbody></table>
    </div></div>`);
}
function exportAll(){ dl(JSON.stringify({DB,ROLL},null,2),'application/json','arthanote-admin-'+iso(new Date())+'.json'); toast('Exported'); }
function rebuild(){ localStorage.removeItem(LS_ROLL); loadRollups(); go(page); toast('Rollups rebuilt'); }
function resetAll(){ if(!confirm('Erase the demo database on this device?'))return;
  localStorage.removeItem(LS); localStorage.removeItem(LS_ROLL); localStorage.removeItem(LS+'_carts'); location.reload(); }

const SPECIAL={
  'dashboard':   {t:'Dashboard',              fn:pgDashboard},
  'reports':     {t:'Reports',                fn:pgReports},
  'warehouses':  {t:'Warehouses',             fn:pgWarehouses},
  'prod-stock':  {t:'In-Stock Checker',       fn:pgStockCheck},
  'prod-barcode':{t:'BarCode Creator',        fn:pgBarcode},
  'sales-pos':   {t:'Billing POS — OUTWARD',  fn:pgBillingPos},
  'ac-dash':     {t:'Accounting — Dashboard', fn:pgAccDash},
  'set-store':   {t:'Settings',               fn:pgStoreSettings},
};

/* ═════════ init ═════════ */
load();
document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
document.getElementById('src-pill').textContent=DB.bills.length+' bills · demo';
renderNav();
go('dashboard');
icons();
addEventListener('resize',()=>{ if(page==='dashboard'||page==='reports') go(page); });
</script>
</body>
</html>
