<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArthaNote — Premium Nav Icons</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
  h1{color:#fff;font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:.5px}
  p{color:#6b7280;font-size:12px;margin-bottom:40px}

  .preview-card{
    background:#1a1a1a;border-radius:20px;padding:32px 40px;
    border:1px solid #2a2a2a;margin-bottom:32px;width:100%;max-width:560px;
  }
  .preview-title{color:#6b7280;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:20px}

  /* Bottom bar preview */
  .bottom-bar{
    background:#0f1110;border-radius:16px;padding:12px 8px 8px;
    display:flex;justify-content:space-around;align-items:flex-end;
    border:1px solid #1e2420;box-shadow:0 8px 32px rgba(0,0,0,.6);
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0 8px;transition:all .2s}
  .nav-item canvas{display:block}
  .nav-label{font-size:9px;font-weight:600;letter-spacing:.3px;transition:color .2s}
  .nav-item.active .nav-label{color:#4ade80}
  .nav-item:not(.active) .nav-label{color:#4b5563}

  /* All icons sheet */
  .icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;margin-top:4px}
  .icon-cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .icon-name{color:#4b5563;font-size:10px;text-align:center;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

  /* Style variants */
  .variants{display:flex;gap:12px;margin-top:20px;justify-content:center}
  .variant-btn{padding:6px 14px;border-radius:8px;border:1px solid #333;color:#9ca3af;font-size:11px;cursor:pointer;background:#1a1a1a;transition:all .15s}
  .variant-btn.active{background:#065f46;color:#fff;border-color:#065f46}

  .size-note{color:#4b5563;font-size:10px;text-align:center;margin-top:16px}
</style>
</head>
<body>

<h1>ArthaNote — Premium Nav Icons</h1>
<p>Luxury line icons · Tap to preview active states</p>

<!-- BOTTOM BAR LIVE PREVIEW -->
<div class="preview-card">
  <div class="preview-title">Live Bottom Bar Preview</div>
  <div class="bottom-bar" id="bottom-bar">
    <!-- populated by JS -->
  </div>
  <div class="size-note">Tap any icon to see active state</div>
</div>

<!-- ALL ICONS SHEET -->
<div class="preview-card">
  <div class="preview-title">All Icons — Active & Inactive</div>
  <div class="icon-grid" id="icon-grid">
    <!-- populated by JS -->
  </div>
</div>

<script>
// ─── Design tokens ────────────────────────────────────────────────────────────
const ACTIVE   = '#4ade80';  // bright green
const INACTIVE = '#4b5563';  // cool grey
const GLOW     = '#065f46';  // deep green for pill bg
const S = 28; // icon draw size (canvas is 28×28)
const W = 1.7; // stroke width

// ─── Icon draw functions ──────────────────────────────────────────────────────
const icons = {

  dashboard(ctx, active) {
    const c = active ? ACTIVE : INACTIVE;
    ctx.strokeStyle = c;
    ctx.lineWidth   = W;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    const r = 2.2, g = 2;
    // top-left square
    rr(ctx, 3, 3, 10, 10, r);
    // top-right square
    rr(ctx, 15, 3, 10, 10, r);
    // bottom-left square — taller
    rr(ctx, 3, 15, 10, 10, r);
    // bottom-right square
    rr(ctx, 15, 15, 10, 10, r);
    if(active) glow(ctx);
  },

  scan(ctx, active) {
    const c = active ? ACTIVE : INACTIVE;
    ctx.strokeStyle = c;
    ctx.lineWidth   = W;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    // corner brackets — top-left
    line(ctx, 3, 9, 3, 4); line(ctx, 3, 4, 9, 4);
    // top-right
    line(ctx, 19, 4, 25, 4); line(ctx, 25, 4, 25, 9);
    // bottom-left
    line(ctx, 3, 19, 3, 24); line(ctx, 3, 24, 9, 24);
    // bottom-right
    line(ctx, 19, 24, 25, 24); line(ctx, 25, 24, 25, 19);
    // scan line
    ctx.globalAlpha = active ? 1 : 0.6;
    line(ctx, 5, 14, 23, 14);
    ctx.globalAlpha = 1;
    // small dot
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(14, 14, 1.4, 0, Math.PI*2); ctx.fill();
  },

  entry(ctx, active) {
    const c = active ? ACTIVE : INACTIVE;
    ctx.strokeStyle = c;
    ctx.lineWidth   = W;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    // document base
    rr(ctx, 5, 4, 14, 18, 2.5);
    // horizontal lines inside
    line(ctx, 8, 10, 16, 10);
    line(ctx, 8, 14, 14, 14);
    // plus badge (top-right)
    ctx.fillStyle = active ? GLOW : '#1f2937';
    ctx.strokeStyle = c;
    ctx.lineWidth = W - 0.2;
    circle(ctx, 20, 8, 5);
    ctx.strokeStyle = c;
    line(ctx, 20, 5.5, 20, 10.5);
    line(ctx, 17.5, 8, 22.5, 8);
  },

  ledger(ctx, active) {
    const c = active ? ACTIVE : INACTIVE;
    ctx.strokeStyle = c;
    ctx.lineWidth   = W;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    // book spine
    line(ctx, 9, 4, 9, 24);
    // book cover
    rr(ctx, 9, 4, 16, 20, 2.5);
    // left cover flap
    ctx.beginPath();
    ctx.moveTo(9, 4); ctx.quadraticCurveTo(4, 7, 4, 14); ctx.quadraticCurveTo(4, 21, 9, 24);
    ctx.stroke();
    // lines in book
    line(ctx, 12, 10, 22, 10);
    line(ctx, 12, 14, 22, 14);
    line(ctx, 12, 18, 18, 18);
  },

  suppliers(ctx, active) {
    const c = active ? ACTIVE : INACTIVE;
    ctx.strokeStyle = c;
    ctx.lineWidth   = W;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    // back person (smaller, offset)
    ctx.globalAlpha = active ? 0.55 : 0.4;
    circle(ctx, 18, 9, 4);
    ctx.beginPath();
    ctx.arc(18, 22, 7, Math.PI, 0);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // front person
    circle(ctx, 11, 10, 4.5);
    ctx.beginPath();
    ctx.arc(11, 24, 8.5, Math.PI, 0);
    ctx.stroke();
  },

  reports(ctx, active) {
    const c = active ? ACTIVE : INACTIVE;
    ctx.strokeStyle = c;
    ctx.lineWidth   = W;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    // bars
    rr(ctx, 4,  16, 5, 8, 1.5);   // left bar
    rr(ctx, 11, 10, 5, 14, 1.5);  // mid bar
    rr(ctx, 18, 6,  5, 18, 1.5);  // right bar (tallest)
    // trend line
    ctx.globalAlpha = active ? 0.7 : 0.35;
    ctx.lineWidth = W - 0.4;
    ctx.beginPath();
    ctx.moveTo(6.5, 15); ctx.lineTo(13.5, 9); ctx.lineTo(20.5, 5);
    ctx.stroke();
    // dot on peak
    ctx.globalAlpha = 1;
    ctx.lineWidth = W;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(20.5, 5, 1.8, 0, Math.PI*2); ctx.fill();
    // x-axis
    ctx.globalAlpha = active ? 0.35 : 0.25;
    line(ctx, 3, 25, 25, 25);
    ctx.globalAlpha = 1;
  },
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.stroke();
}
function line(ctx, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function circle(ctx, cx, cy, r) {
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
}
function glow(ctx) {
  // subtle green dot under active icon
}
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  c.style.width = c.style.height = size + 'px';
  return c;
}

// ─── Render bottom bar ────────────────────────────────────────────────────────
const iconList = [
  {key:'dashboard', label:'Home'},
  {key:'scan',      label:'Scan'},
  {key:'entry',     label:'Entry'},
  {key:'ledger',    label:'Ledger'},
  {key:'suppliers', label:'Suppliers'},
  {key:'reports',   label:'Reports'},
];

let activeIdx = 0;

function renderBar() {
  const bar = document.getElementById('bottom-bar');
  bar.innerHTML = '';
  iconList.forEach((ic, i) => {
    const isActive = i === activeIdx;
    const item = document.createElement('div');
    item.className = 'nav-item' + (isActive ? ' active' : '');

    // pill bg for active
    const wrap = document.createElement('div');
    wrap.style.cssText = isActive
      ? `background:${GLOW};border-radius:10px;padding:5px 10px;transition:all .2s`
      : `padding:5px 10px`;

    const c = makeCanvas(28);
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,28,28);
    icons[ic.key](ctx, isActive);
    wrap.appendChild(c);

    const lbl = document.createElement('div');
    lbl.className = 'nav-label';
    lbl.textContent = ic.label;

    item.appendChild(wrap);
    item.appendChild(lbl);
    item.onclick = () => { activeIdx = i; renderBar(); };
    bar.appendChild(item);
  });
}

// ─── Render icon grid ─────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('icon-grid');
  grid.innerHTML = '';
  iconList.forEach(ic => {
    const cell = document.createElement('div');
    cell.className = 'icon-cell';

    // active canvas (large)
    const ca = makeCanvas(40);
    const cax = ca.getContext('2d');
    cax.scale(40/28, 40/28);
    icons[ic.key](cax, true);

    // inactive canvas
    const ci = makeCanvas(40);
    const cix = ci.getContext('2d');
    cix.scale(40/28, 40/28);
    icons[ic.key](cix, false);

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px';

    const activeWrap = document.createElement('div');
    activeWrap.style.cssText = `background:${GLOW};border-radius:10px;padding:6px 8px`;
    activeWrap.appendChild(ca);

    const inactiveWrap = document.createElement('div');
    inactiveWrap.style.cssText = 'background:#1a1a1a;border-radius:10px;padding:6px 8px;border:1px solid #2a2a2a';
    inactiveWrap.appendChild(ci);

    row.appendChild(activeWrap);
    row.appendChild(inactiveWrap);

    const lbl = document.createElement('div');
    lbl.className = 'icon-name';
    lbl.textContent = ic.label;

    cell.appendChild(row);
    cell.appendChild(lbl);
    grid.appendChild(cell);
  });
}

renderBar();
renderGrid();
</script>
</body>
</html>
