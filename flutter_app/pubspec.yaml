name: arthanote
description: ArthaNote — Shop Ledger for Tamil Nadu retailers
publish_to: 'none'
version: 1.3.14+44
# v1.3.14+44 — Google Play Billing Library 8 + target API 36 (Play Console
# mandates, both by 31 Aug 2026).
#
# ROOT CAUSE of builds #181-184 pub-get failures (confirmed via pub.dev API):
#   1. in_app_purchase_android ^0.5.0 (Billing 8) requires its parent package
#      in_app_purchase to be >=3.3.0 — we had ^3.2.0 pinned, which itself
#      constrains in_app_purchase_android to ^0.4.0. Two direct/transitive
#      constraints on the same package with no overlapping range = unsolvable.
#   2. in_app_purchase 3.3.0 declares environment: flutter ">=3.38.0" — CI was
#      pinned to Flutter 3.35.1, below that floor, so pub get correctly
#      refused to solve. Fix: in_app_purchase ^3.3.0 + Flutter >=3.38.0 in CI
#      (see build-flutter-apk.yml, no more exact-version pin).

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  # Pinned below 1.9.0: that release bumped this plugin's own compileSdk to
  # 37 (pub.dev changelog), which isn't an installable SDK platform on
  # today's tooling/CI (Play Console's mandate is target/compile API 36 —
  # see version note above — not 37). ^1.8.0 alone would still resolve to
  # 1.9.0 since caret allows any 1.x, so cap it explicitly at <1.9.0.
  receive_sharing_intent: ">=1.8.0 <1.9.0"
  google_mlkit_text_recognition: ^0.13.0
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  local_auth: ^2.3.0
  crypto: ^3.0.3
  # ^3.3.0 is required for in_app_purchase_android ^0.5.0 (Billing 8) below —
  # 3.2.0 only permits in_app_purchase_android ^0.4.0 (Billing 7), which was
  # the actual source of every prior pub-get failure.
  in_app_purchase: ^3.3.0
  # 0.5.x ships Google Play Billing Library 8.0.0 — Play Console requires
  # 8.0.0+ for all app updates from 31 Aug 2026. Needs Flutter >=3.38.0 (see
  # CI) because that's the environment floor its parent in_app_purchase 3.3.0
  # declares.
  in_app_purchase_android: ^0.5.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
