name: arthanote
description: ArthaNote — Shop Ledger for Tamil Nadu retailers
publish_to: 'none'
version: 1.3.14+44
# Release build: v1.3.14+44 — Google Play Billing Library 8 + target API 36.
# Play Console mandates (both by 31 Aug 2026): Billing Library 8.0.0+ and
# targetSdk 36 (Android 16). in_app_purchase_android 0.5.x ships Billing 8;
# compileSdk/targetSdk 36 needs AGP 8.9.1 + Gradle 8.11.1 + Flutter 3.35.x.
# On top of v1.3.13+43 (Billing 7 + FB SDK app events).

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  receive_sharing_intent: ^1.8.0
  google_mlkit_text_recognition: ^0.13.0
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  local_auth: ^2.3.0
  crypto: ^3.0.3
  in_app_purchase: ^3.2.0
  # 0.5.x ships Google Play Billing Library 8.0.0 — Play Console requires
  # 8.0.0+ for all app updates from 31 Aug 2026 (needs Flutter 3.35.x, see CI).
  in_app_purchase_android: ^0.5.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
