name: arthanote
description: ArthaNote — Shop Ledger for Tamil Nadu retailers
publish_to: 'none'
version: 1.3.10+40
# Release build: v1.3.10+40 — app-wide Serif Ledger theme (gold accent + serif),
# dashboard redesign, promo-code redemption, web construction module, guest mode,
# monetization gates, 3-month trial, AI date-aware alerts, shop-delete fix.

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  receive_sharing_intent: ^1.8.0
  google_mlkit_text_recognition: ^0.13.0
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
