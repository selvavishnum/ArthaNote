plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.arthanote.app"
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        release {
            def envKeystore = System.getenv("KEYSTORE_PATH")
            if (envKeystore) {
                // CI: GitHub secrets override (for future key rotation)
                storeFile     file(envKeystore)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias      System.getenv("KEY_ALIAS")         ?: ""
                keyPassword   System.getenv("KEY_PASSWORD")      ?: ""
            } else {
                // Default: use the committed release keystore (consistent signing across all builds)
                storeFile     file("arthanote-release.keystore")
                storePassword "ArthaNote2024"
                keyAlias      "arthanote"
                keyPassword   "ArthaNote2024"
            }
        }
    }

    defaultConfig {
        applicationId "com.arthanote.app"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.0.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.android.gms:play-services-auth:21.0.0"
    implementation "androidx.multidex:multidex:2.0.1"
}
