plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Read version from local.properties (written by Flutter tooling before build)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withReader('UTF-8') { localProps.load(it) }
}
def appVersionCode = localProps.getProperty('flutter.versionCode', '2').toInteger()
def appVersionName = localProps.getProperty('flutter.versionName', '1.0.2')

// Parse --dart-define values passed by flutter build
def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { encoded ->
        try {
            def decoded = new String(encoded.trim().bytes.decodeBase64()).split('=')
            if (decoded.length == 2) dartDefines[decoded[0]] = decoded[1]
        } catch (ignored) {}
    }
}

android {
    namespace "com.arthanote.app"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        release {
            def envKeystore = System.getenv("KEYSTORE_PATH")
            if (envKeystore) {
                storeFile     file(envKeystore)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias      System.getenv("KEY_ALIAS")         ?: ""
                keyPassword   System.getenv("KEY_PASSWORD")      ?: ""
            } else {
                // PWABuilder original keystore — matches Play Console registered SHA1
                storeFile     file("arthanote-release.keystore")
                storePassword "WYCLbtHArDji"
                keyAlias      "arthanote-key — more professional"
                keyPassword   "WYCLbtHArDji"
            }
        }
    }

    defaultConfig {
        applicationId dartDefines.getOrDefault('APP_ID', 'com.arthanote.app')
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    // Required for Android 15+ devices that use 16KB memory page sizes
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform("com.google.firebase:firebase-bom:33.0.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.android.gms:play-services-auth:21.0.0"
    implementation "androidx.multidex:multidex:2.0.1"
    // Required for enableEdgeToEdge() — Android 15 edge-to-edge support
    implementation "androidx.activity:activity-ktx:1.9.3"
}
