allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Must match the "org.jetbrains.kotlin.android" plugin version in
// settings.gradle — Flutter requires Kotlin >=2.0.0, and some plugins read
// this legacy ext var directly instead of the declarative plugins block.
ext.kotlin_version = '2.0.21'

rootProject.buildDir = "../build"
subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
subprojects { project.evaluationDependsOn(":app") }

// Force a consistent JVM target (17) across ALL modules — the app and every
// Flutter plugin. Some plugins (e.g. receive_sharing_intent) compile Kotlin
// at 17 but leave Java at 1.8, which the Kotlin 2.x Gradle plugin rejects with
// "Inconsistent JVM-target compatibility".
// NOTE: must NOT use afterEvaluate here — the evaluationDependsOn(":app")
// block above forces :app to evaluate during root configuration, and calling
// afterEvaluate on an already-evaluated project throws. plugins.withId fires
// immediately when the plugin is already applied (or later when it is), and
// tasks.matching{}.configureEach is lazy — both are evaluation-order safe.
subprojects {
    plugins.withId("com.android.library") {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        // Plugins that don't pin their own compileSdkVersion (e.g.
        // receive_sharing_intent) inherit Flutter's internal default, which
        // newer Flutter releases have bumped to 37 — a platform that isn't
        // a real installable SDK component yet, failing Gradle with
        // "Failed to find Platform SDK with path: platforms;android-37".
        //
        // Setting compileSdkVersion inside the immediate plugins.withId
        // block (as a first attempt did) did NOT work: that callback fires
        // the instant the plugin applies, near the TOP of the plugin's own
        // build.gradle — the REST of that file (further down, its own
        // `android { compileSdkVersion flutter.compileSdkVersion }`) then
        // runs afterward and overwrites it back to 37. Using afterEvaluate
        // here is safe (unlike for :app elsewhere in this file) because
        // this block only ever matches "com.android.library" plugins,
        // never :app's "com.android.application" — so none of these
        // subprojects are forced to evaluate early the way :app is.
        project.afterEvaluate {
            android {
                compileSdkVersion 36
            }
        }
    }
    tasks.matching { it.name.startsWith("compile") && it.name.contains("Kotlin") }
        .configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
