org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=false
# Fallback: downgrade Kotlin's JVM-target validation from error to warning so
# a plugin whose Java/Kotlin targets drift can never hard-fail the release
# build (primary fix: root build.gradle aligns every module to 17).
kotlin.jvm.target.validation.mode=warning
