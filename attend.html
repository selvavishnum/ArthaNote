<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>கணக்கபிள்ளை — Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@600;700;800&family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#f0fdf4,#dbeafe);min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.card{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:400px;margin:0 auto}
.logo{text-align:center;margin-bottom:20px}
.logo-icon{font-size:48px;margin-bottom:8px}
.logo-title{font-family:'Noto Sans Tamil','DM Sans',sans-serif;font-size:22px;font-weight:800;color:#065f46}
.logo-sub{font-size:12px;color:#6b7280;margin-top:2px}
.shop-badge{display:inline-flex;align-items:center;gap:8px;background:#f0fdf4;border:1.5px solid #6ee7b7;border-radius:12px;padding:10px 16px;margin-bottom:20px;width:100%}
.shop-name{font-size:15px;font-weight:700;color:#065f46}
.shop-date{font-size:11px;color:#6b7280;margin-top:1px}
.section-title{font-size:11px;font-weight:800;color:#6b7280;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.staff-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.staff-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.staff-btn:active{transform:scale(.97)}
.staff-btn.sel{border-color:#059669;background:#f0fdf4}
.staff-btn.already{border-color:#6ee7b7;background:#f0fdf4;opacity:.7;pointer-events:none}
.av{width:38px;height:38px;border-radius:50%;background:#065f46;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
.av.sel{background:#059669}
.sn{font-size:14px;font-weight:700;flex:1}
.srole{font-size:11px;color:#6b7280}
.check{font-size:20px;margin-left:auto}
.submit-btn{width:100%;padding:16px;border-radius:14px;border:none;background:#065f46;color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.submit-btn:active{transform:scale(.97)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.success-card{text-align:center;padding:20px 0}
.success-icon{font-size:64px;margin-bottom:12px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.success-name{font-family:'Noto Sans Tamil','DM Sans',sans-serif;font-size:24px;font-weight:900;color:#065f46;margin-bottom:6px}
.success-sub{font-size:14px;color:#6b7280;margin-bottom:16px}
.success-meta{background:#f0fdf4;border:1px solid #6ee7b7;border-radius:10px;padding:12px;font-size:12px;color:#374151}
.success-meta div{padding:3px 0}
.add-btn{width:100%;padding:13px;border-radius:12px;border:2px solid #065f46;background:transparent;color:#065f46;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;font-family:'DM Sans',sans-serif}
.loading{text-align:center;padding:40px 20px;color:#6b7280}
.err{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px;font-size:12px;color:#dc2626;margin-bottom:14px;text-align:center}
.custom-wrap{margin-bottom:16px}
.custom-inp{width:100%;padding:13px 14px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s}
.custom-inp:focus{border-color:#059669}
</style>
</head>
<body>
<div class="card" id="main-card">
  <div class="loading" id="loading-wrap">
    <div style="font-size:40px;margin-bottom:12px">☁️</div>
    <div style="font-weight:700;font-size:14px">Loading...</div>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB5q3fFfl5aUXp8d9yb0K_qkI20vdTL2Xg",
  authDomain:"selva-ledger.firebaseapp.com",
  projectId:"selva-ledger",
  storageBucket:"selva-ledger.firebasestorage.app",
  messagingSenderId:"546195090451",
  appId:"1:546195090451:web:26dd2f6aa464721ddae3e6"
});
const DB=firebase.firestore();

// Parse URL params
const params=new URLSearchParams(window.location.search);
const BID=params.get('bid')||'';
const SHOP_ID=params.get('shop')||'s1';
const SHOP_NAME=decodeURIComponent(params.get('sname')||'Shop');
const DATE=params.get('date')||new Date().toISOString().split('T')[0];
const NOW=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});

let _selectedStaff=null;
let _staffList=[];
let _existingAttendance=new Set();

async function init(){
  if(!BID){
    showError('Invalid QR code. Please ask your manager to generate a new QR.');
    return;
  }
  try{
    // Load staff list from Firestore
    const [staffSnap, attSnap]=await Promise.all([
      DB.collection('staff').where('businessId','==',BID).get(),
      DB.collection('attendance').where('businessId','==',BID).where('date','==',DATE).where('shopId','==',SHOP_ID).get()
    ]);

    _staffList=staffSnap.docs.map(d=>d.data()).filter(s=>s.name&&s.role!=='owner');
    attSnap.docs.forEach(d=>_existingAttendance.add(d.data().staffName));

    renderMain();
  }catch(e){
    showError('Connection error: '+e.message);
  }
}

function renderMain(){
  const card=document.getElementById('main-card');
  const dateFormatted=new Date(DATE+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  card.innerHTML=`
    <div class="logo">
      <div class="logo-icon">📒</div>
      <div class="logo-title">கணக்கபிள்ளை</div>
      <div class="logo-sub">Staff Attendance</div>
    </div>
    <div class="shop-badge">
      <div style="font-size:24px">🏪</div>
      <div>
        <div class="shop-name">${esc(SHOP_NAME)}</div>
        <div class="shop-date">📅 ${dateFormatted}</div>
      </div>
    </div>
    <div id="err-wrap"></div>
    <div class="section-title">உங்கள் பேரை தேர்ந்தெடுங்கள்</div>
    <div class="staff-list" id="staff-list-div">
      ${_staffList.length?_staffList.map(s=>{
        const done=_existingAttendance.has(s.name);
        return`<div class="staff-btn${done?' already':''}" id="sbtn-${esc(s.name)}" onclick="selectStaff('${esc(s.name)}','${esc(s.role||'')}')">
          <div class="av">${(s.name||'?').substring(0,1).toUpperCase()}</div>
          <div>
            <div class="sn">${esc(s.name)}</div>
            <div class="srole">${done?'✅ Already marked today':(s.role||'Staff')}</div>
          </div>
          <div class="check">${done?'✅':''}</div>
        </div>`;
      }).join(''):`<div style="text-align:center;padding:12px;color:#6b7280;font-size:13px">No staff added yet. Enter name below.</div>`}
    </div>
    <div class="custom-wrap">
      <div class="section-title">அல்லது பேரை type பண்ணுங்கள்</div>
      <input class="custom-inp" type="text" id="custom-name" placeholder="உங்கள் பேரை உள்ளிடுங்கள்..." oninput="onCustomName(this.value)">
    </div>
    <button class="submit-btn" id="submit-btn" onclick="markAttendance()" disabled>
      ✅ Attendance Mark பண்ணு
    </button>`;
}

function selectStaff(name,role){
  _selectedStaff=name;
  document.querySelectorAll('.staff-btn').forEach(b=>{
    b.classList.remove('sel');
    b.querySelector('.check').textContent='';
    b.querySelector('.av').classList.remove('sel');
  });
  const btn=document.getElementById('sbtn-'+name);
  if(btn){
    btn.classList.add('sel');
    btn.querySelector('.check').textContent='☑️';
    btn.querySelector('.av').classList.add('sel');
  }
  document.getElementById('custom-name').value='';
  document.getElementById('submit-btn').disabled=false;
}

function onCustomName(val){
  _selectedStaff=val.trim()||null;
  document.querySelectorAll('.staff-btn:not(.already)').forEach(b=>b.classList.remove('sel'));
  document.getElementById('submit-btn').disabled=!_selectedStaff;
}

async function markAttendance(){
  if(!_selectedStaff){toast('பேரை select பண்ணுங்கள்');return;}
  if(_existingAttendance.has(_selectedStaff)){
    showErr('நீங்கள் இன்னைக்கு attendance போட்டிருக்கீங்க!');return;
  }
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Saving...';
  try{
    await DB.collection('attendance').add({
      businessId:BID, shopId:SHOP_ID, shopName:SHOP_NAME,
      staffName:_selectedStaff,
      date:DATE, time:NOW,
      markedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    showSuccess(_selectedStaff);
  }catch(e){
    showErr('Error: '+e.message);
    btn.disabled=false; btn.textContent='✅ Attendance Mark பண்ணு';
  }
}

function showSuccess(name){
  const card=document.getElementById('main-card');
  card.innerHTML=`
    <div class="success-card">
      <div class="success-icon">✅</div>
      <div class="success-name">${esc(name)}</div>
      <div class="success-sub">Attendance successfully marked!</div>
      <div class="success-meta">
        <div>🏪 <b>${esc(SHOP_NAME)}</b></div>
        <div>📅 ${DATE}</div>
        <div>⏰ ${NOW}</div>
        <div style="margin-top:6px;color:#059669;font-weight:700">✅ வருகை பதிவாகிவிட்டது!</div>
      </div>
      <button class="add-btn" onclick="init()">⬅ Back (mark another)</button>
    </div>`;
}

function showError(msg){
  document.getElementById('main-card').innerHTML=`
    <div class="logo"><div class="logo-icon">❌</div><div class="logo-title">Error</div></div>
    <div class="err">${msg}</div>
    <div style="text-align:center;font-size:12px;color:#6b7280">Please ask your manager for a new QR code.</div>`;
}

function showErr(msg){
  const wrap=document.getElementById('err-wrap');
  if(wrap) wrap.innerHTML=`<div class="err">${msg}</div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
</body>
</html>
