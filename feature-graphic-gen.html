<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArthaNote Feature Graphic Generator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#1a0a0a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px}
  h1{font-size:20px;font-weight:800;color:#fca5a5;letter-spacing:.5px}
  .canvas-wrap{border-radius:12px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6);max-width:100%;width:fit-content}
  canvas{display:block;max-width:100%;height:auto}
  .btn{padding:14px 32px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#b91c1c,#7f1d1d);color:#fff;transition:all .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(185,28,28,.4)}
  .note{font-size:12px;color:#64748b;text-align:center;max-width:500px;line-height:1.6}
  .size-badge{background:#1e293b;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;color:#fca5a5;border:1px solid #334155}
</style>
</head>
<body>
<h1>🎨 ArthaNote — Play Store Feature Graphic</h1>
<span class="size-badge">1024 × 500 px</span>

<div class="canvas-wrap">
  <canvas id="fg" width="1024" height="500"></canvas>
</div>

<button class="btn" onclick="download()">⬇ Download feature-graphic.png</button>

<p class="note">
  Play Store requires a Feature Graphic (1024×500 px, JPG or PNG, no transparency).<br>
  Upload this in Play Console → Store listing → Graphic assets → Feature Graphic.
</p>

<script>
function roundRect(ctx, x, y, w, h, r){
  if(typeof r === 'number') r = {tl:r,tr:r,br:r,bl:r};
  const {tl=0,tr=0,br=0,bl=0} = r;
  ctx.beginPath();
  ctx.moveTo(x+tl, y);
  ctx.lineTo(x+w-tr, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+tr);
  ctx.lineTo(x+w, y+h-br);
  ctx.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
  ctx.lineTo(x+bl, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-bl);
  ctx.lineTo(x, y+tl);
  ctx.quadraticCurveTo(x, y, x+tl, y);
  ctx.closePath();
}

function draw(){
  const c = document.getElementById('fg');
  const ctx = c.getContext('2d');
  const W = 1024, H = 500;
  const DIV = 400; // divider x position

  // ── 1a. Left zone — White background ──
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, DIV, H);

  // Subtle warm cream radial glow on white side
  const wglow = ctx.createRadialGradient(200, 220, 30, 200, 220, 340);
  wglow.addColorStop(0, 'rgba(255,245,245,1)');
  wglow.addColorStop(1, 'rgba(255,235,235,0.6)');
  ctx.fillStyle = wglow;
  ctx.fillRect(0, 0, DIV, H);

  // ── 1b. Right zone — Luxury deep red ──
  const rbg = ctx.createLinearGradient(DIV, 0, W, H);
  rbg.addColorStop(0, '#9b1c1c');
  rbg.addColorStop(0.5, '#7f1d1d');
  rbg.addColorStop(1, '#6b1414');
  ctx.fillStyle = rbg;
  ctx.fillRect(DIV, 0, W - DIV, H);

  // ── 2. Diagonal stripe texture (right side only) ──
  ctx.save();
  ctx.beginPath();
  ctx.rect(DIV, 0, W - DIV, H);
  ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 10;
  for(let i = -H; i < W + H; i += 38){
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + H, H);
    ctx.stroke();
  }
  ctx.restore();

  // ── 3. Right radial warm glow ──
  const rglow = ctx.createRadialGradient(750, 180, 20, 750, 180, 280);
  rglow.addColorStop(0, 'rgba(255,200,180,0.1)');
  rglow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rglow;
  ctx.fillRect(DIV, 0, W - DIV, H);

  // ── 4. Vertical divider (hard edge + glow) ──
  // Hard edge shadow on left side of divider
  const divGrad = ctx.createLinearGradient(DIV - 30, 0, DIV + 10, 0);
  divGrad.addColorStop(0, 'rgba(180,80,80,0)');
  divGrad.addColorStop(1, 'rgba(155,28,28,0.35)');
  ctx.fillStyle = divGrad;
  ctx.fillRect(DIV - 30, 0, 40, H);

  // ── 5. AN circle (left zone, on white) ──
  const cx = 195, cy = 185, cr = 105;
  ctx.save();
  ctx.shadowColor = 'rgba(155,28,28,0.25)';
  ctx.shadowBlur = 28;
  ctx.shadowOffsetX = 6;
  ctx.shadowOffsetY = 8;
  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, cr + 7, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(155,28,28,0.18)';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // Circle fill — luxury red
  ctx.beginPath();
  ctx.arc(cx, cy, cr, 0, Math.PI*2);
  const cg = ctx.createLinearGradient(cx-cr, cy-cr, cx+cr, cy+cr);
  cg.addColorStop(0, '#b91c1c');
  cg.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = cg;
  ctx.fill();
  ctx.restore();

  // ── 6. "AN" inside circle ──
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 82px Georgia, serif';
  ctx.fillText('AN', cx, cy);

  // ── 7. "ArthaNote" below circle (dark red on white) ──
  ctx.fillStyle = '#7f1d1d';
  ctx.font = '700 36px Georgia, serif';
  ctx.textBaseline = 'top';
  ctx.fillText('ArthaNote', cx, cy + cr + 20);

  // Thin red underline
  ctx.strokeStyle = 'rgba(155,28,28,0.25)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - 90, cy + cr + 64);
  ctx.lineTo(cx + 90, cy + cr + 64);
  ctx.stroke();

  // ── 8. "SHOP LEDGER" title (right zone) ──
  const rCx = DIV + (W - DIV) / 2; // center of right zone = 712
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = '900 50px system-ui, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText('SHOP LEDGER', rCx, 42);

  // Gold-ish underline accent under title
  const ulGrad = ctx.createLinearGradient(DIV + 20, 0, W - 20, 0);
  ulGrad.addColorStop(0, 'rgba(252,211,77,0)');
  ulGrad.addColorStop(0.3, 'rgba(252,211,77,0.7)');
  ulGrad.addColorStop(0.7, 'rgba(252,211,77,0.7)');
  ulGrad.addColorStop(1, 'rgba(252,211,77,0)');
  ctx.strokeStyle = ulGrad;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(DIV + 24, 104);
  ctx.lineTo(W - 24, 104);
  ctx.stroke();

  // ── 9. Feature pills — 8 items in 2×4 grid ──
  const features = [
    { icon: '💰', label: 'Daily Sales & Expense' },
    { icon: '📊', label: 'Dashboard' },
    { icon: '💎', label: 'Finance & Chit Fund' },
    { icon: '📒', label: 'Ledger' },
    { icon: '🤝', label: 'Supplier' },
    { icon: '📈', label: 'Report 360°' },
    { icon: '👥', label: 'Staff Attendance' },
    { icon: '➕', label: 'Staff User Add' },
  ];

  const pillW = 238, pillH = 44, pillR = 22;
  const pillGapX = 16, pillGapY = 10;
  const totalPillsW = pillW * 2 + pillGapX;
  const pillsStartX = rCx - totalPillsW / 2;
  const pillsStartY = 120;

  features.forEach((p, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const px = pillsStartX + col * (pillW + pillGapX);
    const py = pillsStartY + row * (pillH + pillGapY);

    // Pill bg
    roundRect(ctx, px, py, pillW, pillH, pillR);
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fill();
    roundRect(ctx, px, py, pillW, pillH, pillR);
    ctx.strokeStyle = 'rgba(255,200,200,0.28)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Pill text
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.icon + '  ' + p.label, px + pillW / 2, py + pillH / 2);
  });

  // ── 10. Bottom strip ──
  const stripY = H - 54;

  // Left strip (white side) — light warm tint
  const lsg = ctx.createLinearGradient(0, stripY, 0, H);
  lsg.addColorStop(0, 'rgba(200,100,100,0.08)');
  lsg.addColorStop(1, 'rgba(200,100,100,0.15)');
  ctx.fillStyle = lsg;
  ctx.fillRect(0, stripY, DIV, H - stripY);

  // Right strip (red side) — darker red
  const rsg = ctx.createLinearGradient(0, stripY, 0, H);
  rsg.addColorStop(0, 'rgba(0,0,0,0.20)');
  rsg.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = rsg;
  ctx.fillRect(DIV, stripY, W - DIV, H - stripY);

  // Strip separator line
  ctx.strokeStyle = 'rgba(180,80,80,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, stripY);
  ctx.lineTo(W, stripY);
  ctx.stroke();

  // arthanote.com (left, red text)
  ctx.fillStyle = '#9b1c1c';
  ctx.font = '600 15px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('arthanote.com', 28, stripY + 27);

  // "Available on Android & Web" center
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '400 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Available on Android & Web', rCx, stripY + 27);

  // Free trial badge (right)
  roundRect(ctx, W - 208, stripY + 9, 184, 34, 17);
  const badgeGrad = ctx.createLinearGradient(W - 208, 0, W - 24, 0);
  badgeGrad.addColorStop(0, 'rgba(252,211,77,0.9)');
  badgeGrad.addColorStop(1, 'rgba(245,158,11,0.9)');
  ctx.fillStyle = badgeGrad;
  ctx.fill();
  ctx.fillStyle = '#7f1d1d';
  ctx.font = '800 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✦ 30-day FREE trial', W - 208 + 92, stripY + 26);
}

function download(){
  const c = document.getElementById('fg');
  const a = document.createElement('a');
  a.download = 'feature-graphic.png';
  a.href = c.toDataURL('image/png');
  a.click();
}

draw();
</script>
</body>
</html>
