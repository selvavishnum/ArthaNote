name: noise_clear
description: AI-powered voice noise cancellation and voice transformation app.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio recording (mic input)
  record: ^5.1.2

  # Audio playback
  just_audio: ^0.9.40

  # File picker (import audio)
  file_picker: ^8.1.2

  # File system paths
  path_provider: ^2.1.4

  # Runtime permissions (mic, storage)
  permission_handler: ^11.3.1

  # State management
  provider: ^6.1.2

  # Share / export processed file
  share_plus: ^10.0.2

  # UI extras
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
