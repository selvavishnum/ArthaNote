<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>ArthaNote – Stats Post</title>
<style>
  :root { --p:#065f46; --s:#059669; --a:#d97706; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:1080px; height:1080px; overflow:hidden;
    background:#0f172a;
    font-family:-apple-system,'Segoe UI','Helvetica Neue',sans-serif;
    display:flex; flex-direction:column;
  }

  /* GLOW EFFECT */
  .glow-orb {
    position:fixed; border-radius:50%; pointer-events:none;
    filter:blur(80px);
  }
  .glow-orb.g1 { width:500px;height:500px;background:rgba(5,150,105,0.15);top:-100px;left:-100px; }
  .glow-orb.g2 { width:400px;height:400px;background:rgba(217,119,6,0.08);bottom:-100px;right:-100px; }
  .glow-orb.g3 { width:300px;height:300px;background:rgba(5,150,105,0.08);top:50%;left:50%;transform:translate(-50%,-50%); }

  /* HEADER */
  .header {
    height:88px; flex-shrink:0;
    background:rgba(255,255,255,0.03);
    border-bottom:1px solid rgba(255,255,255,0.06);
    display:flex; align-items:center; padding:0 56px; gap:16px;
    position:relative; z-index:10;
  }
  .logo-sq {
    width:50px;height:50px;background:linear-gradient(135deg,var(--p),var(--s));
    border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  .header-brand { font-size:28px;font-weight:800;color:#fff; }
  .header-sub { font-size:16px;color:rgba(255,255,255,0.5);font-weight:400; }
  .header-right { margin-left:auto; display:flex;align-items:center;gap:12px; }
  .live-dot { width:10px;height:10px;border-radius:50%;background:#22c55e;animation:livePulse 1.5s ease infinite; }
  .live-text { font-size:16px;font-weight:600;color:#22c55e; }

  /* TITLE */
  .post-title {
    text-align:center; padding:36px 80px 24px;
    font-size:44px; font-weight:900; color:#fff;
    letter-spacing:-1px; line-height:1.1;
    position:relative; z-index:10;
    opacity:0; animation:fadeUp 0.6s ease 0.4s forwards;
  }
  .post-title .hl { color:#34d399; }

  /* STATS GRID */
  .stats-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:24px;
    padding:0 56px; flex:1;
    position:relative; z-index:10;
  }

  .stat-card {
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    padding:36px 32px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:12px; text-align:center;
    position:relative; overflow:hidden;
    opacity:0; transform:scale(0.9);
  }
  .stat-card:nth-child(1) { animation:cardPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) 0.6s forwards; }
  .stat-card:nth-child(2) { animation:cardPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) 0.9s forwards; }
  .stat-card:nth-child(3) { animation:cardPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) 1.2s forwards; }
  .stat-card:nth-child(4) { animation:cardPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) 1.5s forwards; }

  /* Glow border on each card */
  .stat-card::before {
    content:''; position:absolute; inset:0; border-radius:24px;
    background:radial-gradient(ellipse at 50% 0%, rgba(52,211,153,0.1) 0%, transparent 70%);
    opacity:0; transition:opacity 0.3s;
  }
  .stat-card:hover::before { opacity:1; }

  .stat-emoji { font-size:52px; filter:drop-shadow(0 0 16px rgba(52,211,153,0.4)); }
  .stat-number {
    font-size:72px; font-weight:900; color:#fff;
    letter-spacing:-2px; line-height:1;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#fff 0%,#34d399 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    animation:numberGlow 3s ease infinite;
  }
  .stat-number .suffix { font-size:36px; letter-spacing:0; }
  .stat-label { font-size:20px;font-weight:600;color:rgba(255,255,255,0.6);line-height:1.3; }

  /* Animated ring */
  .stat-ring {
    position:absolute; border-radius:50%;
    border:1px solid rgba(52,211,153,0.1);
    pointer-events:none; top:50%; left:50%;
  }
  .stat-ring.r1 {
    width:200px;height:200px;transform:translate(-50%,-50%);
    animation:ringPulse 3s ease infinite;
  }
  .stat-ring.r2 {
    width:280px;height:280px;transform:translate(-50%,-50%);
    animation:ringPulse 3s ease 1s infinite;
  }

  /* FOOTER */
  .footer {
    height:64px; flex-shrink:0;
    background:linear-gradient(135deg,var(--p) 0%,var(--s) 100%);
    display:flex; align-items:center; justify-content:center; gap:16px;
    position:relative; z-index:10;
    opacity:0; animation:slideUp 0.5s ease 2.0s forwards;
  }
  .footer-text { font-size:22px;font-weight:700;color:#fff; }
  .footer-sep { font-size:22px;color:rgba(255,255,255,0.4); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes cardPop { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
  @keyframes numberGlow { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3)} }
  @keyframes ringPulse { 0%{opacity:0.3;transform:translate(-50%,-50%) scale(0.8)} 50%{opacity:0.1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0.3;transform:translate(-50%,-50%) scale(0.8)} }
  @keyframes slideUp { from{transform:translateY(64px)} to{transform:translateY(0)} }
  @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
</style>
</head>
<body>
<div class="glow-orb g1"></div>
<div class="glow-orb g2"></div>
<div class="glow-orb g3"></div>

<div class="header">
  <div class="logo-sq">📒</div>
  <div>
    <div class="header-brand">ArthaNote</div>
    <div class="header-sub">Tamil Nadu Shop Ledger</div>
  </div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span class="live-text">LIVE DATA</span>
  </div>
</div>

<div class="post-title" id="postTitle">
  ArthaNote <span class="hl">By The Numbers</span>
</div>

<div class="stats-grid" id="statsGrid">
  <!-- Injected by JS -->
</div>

<div class="footer">
  <span class="footer-text">arthanote.com</span>
  <span class="footer-sep">|</span>
  <span class="footer-text">Free for Tamil Nadu Retailers</span>
</div>

<script>
  const p = new URLSearchParams(window.location.search);
  const title    = p.get('title') || 'ArthaNote By The Numbers';
  const statsRaw = p.get('stats') || 'Transactions Saved:50K+:📊|Active Shops:1200+:🏪|Daily Entries:8000+:✏️|Cities Covered:120+:📍';

  // Title
  const titleEl = document.getElementById('postTitle');
  const tw = title.split(' ');
  const last2 = tw.splice(-2).join(' ');
  titleEl.innerHTML = tw.join(' ') + (tw.length?' ':'') + `<span class="hl">${last2}</span>`;

  // Stats
  const stats = statsRaw.split('|').slice(0,4);
  const grid  = document.getElementById('statsGrid');

  stats.forEach((s,i) => {
    const parts = s.split(':');
    const label = parts[0] || 'Stat';
    const value = parts[1] || '100+';
    const emo   = parts[2] || '⭐';

    // Parse numeric portion and suffix
    const numMatch = value.match(/^([\d,]+)(.*)/);
    const numStr   = numMatch ? numMatch[1].replace(/,/g,'') : '0';
    const suffix   = numMatch ? numMatch[2] : value;
    const target   = parseInt(numStr) || 0;

    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `
      <div class="stat-ring r2"></div>
      <div class="stat-ring r1"></div>
      <div class="stat-emoji">${emo}</div>
      <div class="stat-number"><span class="num-val" data-target="${target}" data-start="${(0.6+i*0.3)*1000}">${target < 100 ? '0' : '0'}</span><span class="suffix">${suffix}</span></div>
      <div class="stat-label">${label}</div>
    `;
    grid.appendChild(card);
  });

  // Count-up animation
  document.querySelectorAll('.num-val').forEach(el => {
    const target = parseInt(el.dataset.target);
    const delay  = parseFloat(el.dataset.start);
    const duration = 2000;
    let startTime = null;

    function easeOut(t) { return 1 - Math.pow(1-t, 3); }

    setTimeout(() => {
      function step(ts) {
        if(!startTime) startTime = ts;
        const elapsed = ts - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const current = Math.round(easeOut(progress) * target);
        // Format with K/M
        if(target >= 1000) {
          el.textContent = (current >= 1000 ? (current/1000).toFixed(1).replace(/\.0$/,'')+'K' : current);
        } else {
          el.textContent = current;
        }
        if(progress < 1) requestAnimationFrame(step);
        else el.textContent = target >= 1000
          ? (target/1000).toFixed(1).replace(/\.0$/,'')+'K'
          : target;
      }
      requestAnimationFrame(step);
    }, delay);
  });
</script>
</body>
</html>
