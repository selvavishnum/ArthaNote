<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArthaNote Marketing Studio</title>
<style>
:root {
  --p:#065f46; --s:#059669; --a:#d97706;
  --bg:#0f172a; --surface:#1e293b; --border:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --green:#34d399;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Segoe UI','Helvetica Neue',sans-serif;overflow:hidden;}

/* ── TOPBAR ── */
.topbar{
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;
  position:relative;z-index:100;
}
.top-logo{display:flex;align-items:center;gap:10px;}
.top-logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--p),var(--s));
  border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.top-logo-name{font-size:18px;font-weight:800;color:#fff;}
.top-logo-sub{font-size:12px;color:var(--muted);}
.top-day{margin-left:20px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);
  border-radius:100px;padding:4px 14px;font-size:13px;font-weight:700;color:var(--green);}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;}

/* Music Player */
.music-player{display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:100px;padding:6px 16px;}
.music-btn{width:30px;height:30px;border-radius:50%;background:var(--s);border:none;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.music-btn:hover{background:var(--p);}
.music-styles{display:flex;gap:4px;}
.music-style{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:600;
  border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.music-style.active{background:rgba(5,150,105,0.2);border-color:var(--s);color:var(--green);}
.music-vol{width:70px;accent-color:var(--s);}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - 56px);}

/* ── LEFT CALENDAR ── */
.calendar{
  width:280px;flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;padding:16px 12px;
}
.cal-header{font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding:0 4px;}
.cal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.cal-day{
  padding:10px 8px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;transition:all 0.2s;
  background:rgba(255,255,255,0.02);
}
.cal-day:hover{background:rgba(255,255,255,0.06);border-color:var(--border);}
.cal-day.active{background:rgba(5,150,105,0.15);border-color:var(--s);}
.cal-day.today{background:rgba(52,211,153,0.12);border-color:var(--green);
  box-shadow:0 0 0 1px rgba(52,211,153,0.2);}
.cal-day-num{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.cal-day.today .cal-day-num{color:var(--green);}
.cal-day.active .cal-day-num{color:var(--green);}
.cal-day-icons{display:flex;gap:3px;font-size:14px;}
.cal-day-label{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── CENTER ── */
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0a0f1a;}

.format-tabs{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
}
.fmt-tab{
  padding:12px 20px;font-size:13px;font-weight:600;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;
  white-space:nowrap;
}
.fmt-tab:hover{color:var(--text);}
.fmt-tab.active{color:var(--green);border-bottom-color:var(--green);}

.preview-area{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:20px;overflow:auto;}
.preview-frame-wrap{
  position:relative;background:#111;border-radius:12px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  flex-shrink:0;
}
.preview-iframe{border:none;display:block;
  transform-origin:top left;}

.preview-actions{display:flex;gap:10px;align-items:center;flex-shrink:0;}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;transition:all 0.2s;}
.btn-primary{background:var(--s);color:#fff;}
.btn-primary:hover{background:var(--p);}
.btn-secondary{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:rgba(255,255,255,0.1);}
.btn-amber{background:var(--a);color:#fff;}
.btn-amber:hover{background:#b45309;}

/* ── RIGHT PANEL ── */
.right-panel{
  width:320px;flex-shrink:0;
  background:var(--surface);border-left:1px solid var(--border);
  overflow-y:auto;padding:0;
}
.panel-section{padding:16px 18px;border-bottom:1px solid var(--border);}
.panel-label{font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}

/* Day info */
.day-info{display:flex;flex-direction:column;gap:8px;}
.day-info-row{display:flex;justify-content:space-between;align-items:center;}
.di-label{font-size:13px;color:var(--muted);}
.di-value{font-size:13px;font-weight:600;color:var(--text);}
.topic-badge{
  display:inline-block;padding:3px 10px;border-radius:100px;
  font-size:11px;font-weight:700;
  background:rgba(5,150,105,0.2);border:1px solid rgba(5,150,105,0.4);color:var(--green);
}
.format-badge{
  display:inline-block;padding:3px 10px;border-radius:100px;
  font-size:11px;font-weight:700;
  background:rgba(217,119,6,0.2);border:1px solid rgba(217,119,6,0.4);color:#fbbf24;
}

/* Claude AI box */
.claude-box{}
.api-row{display:flex;gap:6px;margin-bottom:8px;}
.api-input{
  flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;
}
.api-input:focus{outline:none;border-color:var(--s);}
.api-input::placeholder{color:var(--muted);}
.gen-btn{
  width:100%;padding:10px;border-radius:8px;
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all 0.2s;
}
.gen-btn:hover{background:linear-gradient(135deg,#6d28d9,#5b21b6);}
.gen-btn:disabled{opacity:0.5;cursor:not-allowed;}
.gen-status{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px;}

/* Caption */
.caption-wrap{position:relative;}
.caption-ta{
  width:100%;min-height:100px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:8px;padding:10px;
  color:var(--text);font-size:12px;line-height:1.5;resize:vertical;
  font-family:inherit;
}
.caption-ta:focus{outline:none;border-color:var(--s);}
.caption-copy{
  position:absolute;top:6px;right:6px;
  background:rgba(255,255,255,0.08);border:1px solid var(--border);
  border-radius:6px;padding:4px 8px;font-size:10px;font-weight:600;
  color:var(--muted);cursor:pointer;
}
.caption-copy:hover{color:var(--text);}

/* Hashtags */
.hashtags-wrap{
  background:rgba(255,255,255,0.02);border:1px solid var(--border);
  border-radius:8px;padding:10px;font-size:11px;color:var(--green);
  line-height:1.6;word-break:break-all;
  position:relative;
}
.hash-copy{
  position:absolute;top:6px;right:6px;
  background:rgba(255,255,255,0.08);border:1px solid var(--border);
  border-radius:6px;padding:4px 8px;font-size:10px;font-weight:600;
  color:var(--muted);cursor:pointer;
}
.hash-copy:hover{color:var(--text);}

/* Export links */
.export-links{display:flex;flex-direction:column;gap:6px;}
.export-link{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;background:rgba(255,255,255,0.03);
  border:1px solid var(--border);border-radius:8px;
  font-size:12px;color:var(--text);cursor:pointer;
  text-decoration:none;transition:all 0.2s;
}
.export-link:hover{background:rgba(255,255,255,0.07);border-color:var(--s);}
.export-link-label{display:flex;align-items:center;gap:8px;}
.export-link-arrow{color:var(--muted);font-size:14px;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1e293b;border:1px solid var(--s);border-radius:8px;
  padding:10px 20px;font-size:13px;color:var(--green);font-weight:600;
  z-index:9999;pointer-events:none;
  opacity:0;transition:opacity 0.3s;
}
.toast.show{opacity:1;}
</style>

</div>

const FORMAT_INFO = {
  text:  { icon:'📝', label:'Text Post',   file:'post-text.html',  w:1080, h:1080 },
  card:  { icon:'🃏', label:'Card Post',   file:'post-card.html',  w:1080, h:1080 },
  howto: { icon:'📖', label:'How-To Post', file:'post-howto.html', w:1080, h:1350 },
  reel:  { icon:'🎬', label:'Reel/Story',  file:'post-reel.html',  w:1080, h:1920 },
  stats: { icon:'📊', label:'Stats Post',  file:'post-stats.html', w:1080, h:1080 }
};

const TOPIC_ICONS = {
  benefits:'🚀', howto:'📖', features:'⭐', personal:'💰', finance:'💎', attendance:'📍'
};

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let selectedDay = 1;
let selectedFormat = 'reel';

// Today's day in the 30-day cycle (1-based, based on current date)
const today = new Date();
const startOfYear = new Date(today.getFullYear(), 0, 1);
const dayOfYear = Math.floor((today - startOfYear) / 86400000) + 1;
const todayPlanDay = ((dayOfYear - 1) % 30) + 1;

// ═══════════════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════════════
function buildCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  PLAN.forEach(d => {
    const div = document.createElement('div');
    div.className = 'cal-day' +
      (d.day === selectedDay ? ' active' : '') +
      (d.day === todayPlanDay ? ' today' : '');
    div.innerHTML = `
      <div class="cal-day-num">Day ${d.day}${d.day===todayPlanDay?' ●':''}</div>
      <div class="cal-day-icons">
        <span title="${d.topicLabel}">${TOPIC_ICONS[d.topic]||'📋'}</span>
        <span title="${FORMAT_INFO[d.format]?.label||d.format}">${FORMAT_INFO[d.format]?.icon||'📄'}</span>
      </div>
      <div class="cal-day-label">${d.topicLabel}</div>
    `;
    div.addEventListener('click', () => { selectedDay = d.day; selectedFormat = d.format; loadDay(d.day); });
    grid.appendChild(div);
  });
}

// ═══════════════════════════════════════════════
//  LOAD DAY
// ═══════════════════════════════════════════════
function loadDay(dayNum) {
  const d = PLAN.find(x => x.day === dayNum);
  if(!d) return;
  selectedDay = dayNum;
  selectedFormat = d.format;

  // Update calendar highlight
  document.querySelectorAll('.cal-day').forEach((el,i) => {
    el.classList.toggle('active', PLAN[i].day === dayNum);
  });

  // Top badge
  document.getElementById('topDayBadge').textContent = `Day ${dayNum} / 30`;

  // Day info panel
  document.getElementById('di-day').textContent    = `${dayNum} of 30`;
  document.getElementById('di-topic').textContent  = d.topicLabel;
  document.getElementById('di-format').textContent = FORMAT_INFO[d.format]?.label || d.format;
  document.getElementById('di-tahead').textContent = d.taHead;
  document.getElementById('di-enhead').textContent = d.enHead;

  // Caption
  document.getElementById('captionTA').value = d.caption;

  // Hashtags
  document.getElementById('hashtagsText').textContent = d.tags.join(' ');

  // Format tabs — highlight current format
  document.querySelectorAll('.fmt-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.fmt === d.format);
  });

  // Export links
  buildExportLinks(d);

  // Preview
  renderPreview(d, d.format);
}

// ═══════════════════════════════════════════════
//  FORMAT TABS
// ═══════════════════════════════════════════════
document.getElementById('formatTabs').addEventListener('click', e => {
  const tab = e.target.closest('.fmt-tab');
  if(!tab) return;
  selectedFormat = tab.dataset.fmt;
  document.querySelectorAll('.fmt-tab').forEach(t => t.classList.toggle('active', t.dataset.fmt === selectedFormat));
  const d = PLAN.find(x => x.day === selectedDay);
  if(d) renderPreview(d, selectedFormat);
});

// ═══════════════════════════════════════════════
//  PREVIEW
// ═══════════════════════════════════════════════
function buildPostUrl(d, fmt) {
  const fi = FORMAT_INFO[fmt] || FORMAT_INFO.text;
  const params = new URLSearchParams();
  params.set('headline', d.taHead);
  params.set('subtext',  d.enHead);
  params.set('points',   d.points.join('|'));
  params.set('emoji',    d.emoji);
  params.set('feature',  d.topicLabel);
  params.set('description', d.enHead);
  params.set('icon',     d.emoji);
  params.set('title',    d.enHead);
  params.set('steps',    d.points.join('|'));
  params.set('topic',    d.topicLabel);
  // stats
  const statsArr = [
    `${d.points[0]?.split(' ').slice(0,3).join(' ')||'Shops'}:1200+:🏪`,
    `${d.points[1]?.split(' ').slice(0,3).join(' ')||'Entries'}:50K+:✏️`,
    `${d.points[2]?.split(' ').slice(0,3).join(' ')||'Cities'}:120+:📍`,
    `${d.points[3]?.split(' ').slice(0,3).join(' ')||'Users'}:5K+:👤`
  ];
  params.set('stats', statsArr.join('|'));
  return fi.file + '?' + params.toString();
}

function renderPreview(d, fmt) {
  const fi = FORMAT_INFO[fmt] || FORMAT_INFO[d.format];
  const fw = fi.w;
  const fh = fi.h;

  const wrap = document.getElementById('frameWrap');
  const iframe = document.getElementById('previewIframe');

  // Calculate scale to fit in preview area
  const previewArea = document.getElementById('previewArea');
  const areaW = previewArea.offsetWidth - 40;
  const areaH = previewArea.offsetHeight - 100;
  const scaleX = areaW / fw;
  const scaleY = areaH / fh;
  const scale  = Math.min(scaleX, scaleY, 0.5);

  wrap.style.width  = (fw * scale) + 'px';
  wrap.style.height = (fh * scale) + 'px';

  iframe.style.width  = fw + 'px';
  iframe.style.height = fh + 'px';
  iframe.style.transform = `scale(${scale})`;
  iframe.style.transformOrigin = 'top left';

  const url = buildPostUrl(d, fmt);
  iframe.src = url;
}

function refreshPreview() {
  const d = PLAN.find(x => x.day === selectedDay);
  if(d) renderPreview(d, selectedFormat);
}

function openFullscreen() {
  const d = PLAN.find(x => x.day === selectedDay);
  if(!d) return;
  const url = buildPostUrl(d, selectedFormat);
  window.open(url, '_blank');
}

function copyPostUrl() {
  const d = PLAN.find(x => x.day === selectedDay);
  if(!d) return;
  const url = window.location.origin + window.location.pathname.replace('studio.html','') + buildPostUrl(d, selectedFormat);
  navigator.clipboard.writeText(url).then(() => showToast('URL copied!')).catch(() => showToast('Copy URL from address bar'));
}

// ═══════════════════════════════════════════════
//  EXPORT LINKS
// ═══════════════════════════════════════════════
function buildExportLinks(d) {
  const el = document.getElementById('exportLinks');
  el.innerHTML = '';
  Object.entries(FORMAT_INFO).forEach(([fmt, fi]) => {
    const url  = buildPostUrl(d, fmt);
    const link = document.createElement('a');
    link.href   = url;
    link.target = '_blank';
    link.className = 'export-link';
    link.innerHTML = `
      <span class="export-link-label">${fi.icon} ${fi.label} (${fi.w}×${fi.h})</span>
      <span class="export-link-arrow">↗</span>
    `;
    el.appendChild(link);
  });
}

// ═══════════════════════════════════════════════
//  COPY HELPERS
// ═══════════════════════════════════════════════
function copyText(id) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value || el.textContent).then(() => showToast('Copied!'));
}
function copyHashtags() {
  const t = document.getElementById('hashtagsText').textContent;
  navigator.clipboard.writeText(t).then(() => showToast('Hashtags copied!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

- 10 hashtags relevant to Tamil Nadu small business and the topic

Format your response as:

[caption here]

        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 512,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if(!resp.ok) {
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const text = data.content?.[0]?.text || '';

    // Parse caption and hashtags
    const capMatch  = text.match(/CAPTION:\s*\n([\s\S]*?)(?:\n\nHASHTAGS:|$)/i);
    const hashMatch = text.match(/HASHTAGS:\s*\n([\s\S]*?)$/i);

    if(capMatch) document.getElementById('captionTA').value = capMatch[1].trim();
    if(hashMatch) document.getElementById('hashtagsText').textContent = hashMatch[1].trim();

    status.textContent = '✅ Content generated!';
    showToast('Content generated!');
  } catch(e) {
    status.textContent = '❌ Error: ' + e.message;
    showToast('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🤖 Generate Content';
  }
}

// ═══════════════════════════════════════════════
//  MUSIC — Web Audio API
// ═══════════════════════════════════════════════
let audioCtx = null;
let musicPlaying = false;
let currentStyle = 'upbeat';
let musicNodes = [];

function ensureCtx() {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function stopMusic() {
  musicNodes.forEach(n => { try{ n.stop(); }catch(e){} });
  musicNodes = [];
  musicPlaying = false;
  document.getElementById('playBtn').textContent = '▶';
}

function playUpbeat(ctx, masterGain) {
  // C major arpeggio: C4 E4 G4 C5 at 120BPM (0.5s per 16th)
  const notes = [261.63, 329.63, 392, 523.25, 392, 329.63, 261.63, 329.63];
  const bpm   = 120;
  const step  = 60 / bpm;
  const loop  = () => {
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.connect(g); g.connect(masterGain);
      osc.frequency.value = freq;
      osc.type = 'triangle';
      const t = ctx.currentTime + i * step * 0.5;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + step * 0.45);
      osc.start(t); osc.stop(t + step * 0.5);
    });
  };
  loop();
  const interval = setInterval(() => { if(!musicPlaying) { clearInterval(interval); return; } loop(); }, notes.length * step * 500);
  musicNodes.push({ stop: () => clearInterval(interval) });
}

function playTamil(ctx, masterGain) {
  // Pentatonic: C D E G A (Sa Re Ga Pa Da)
  const scale = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33];
  const pattern = [0,2,4,5,4,2,0,1];
  const step = 0.6;
  const loop = () => {
    pattern.forEach((ni, i) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.connect(g); g.connect(masterGain);
      osc.frequency.value = scale[ni];
      osc.type = 'sine';
      const t = ctx.currentTime + i * step;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + step * 0.8);
      osc.start(t); osc.stop(t + step);
    });
  };
  loop();
  const interval = setInterval(() => { if(!musicPlaying){ clearInterval(interval); return; } loop(); }, pattern.length * step * 1000);
  musicNodes.push({ stop: () => clearInterval(interval) });
}

function playMinimal(ctx, masterGain) {
  // Kick + hihat pattern at 100BPM
  const bpm = 100;
  const beat = 60 / bpm;

  const playKick = (t) => {
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.connect(g); g.connect(masterGain);
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  };

  const playHat = (t) => {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*0.3;
    const src = ctx.createBufferSource();
    const g   = ctx.createGain();
    const filt= ctx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 5000;
    src.buffer = buf;
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    src.start(t); src.stop(t+0.05);
  };

  const loop = () => {
    const now = ctx.currentTime;
    // Kick on beats 1 and 3
    playKick(now);
    playKick(now + beat * 2);
    // Hi-hat on every 8th
    for(let i=0;i<8;i++) playHat(now + i * beat * 0.5);
  };
  loop();
  const interval = setInterval(() => { if(!musicPlaying){clearInterval(interval);return;} loop(); }, beat * 4000);
  musicNodes.push({ stop: () => clearInterval(interval) });
}

document.getElementById('playBtn').addEventListener('click', () => {
  if(musicPlaying) {
    stopMusic();
  } else {
    const ctx = ensureCtx();
    if(ctx.state === 'suspended') ctx.resume();
    const masterGain = ctx.createGain();
    masterGain.gain.value = parseFloat(document.getElementById('volSlider').value);
    masterGain.connect(ctx.destination);
    musicNodes.push(masterGain);
    musicPlaying = true;
    document.getElementById('playBtn').textContent = '⏸';
    if(currentStyle === 'upbeat') playUpbeat(ctx, masterGain);
    else if(currentStyle === 'tamil') playTamil(ctx, masterGain);
    else playMinimal(ctx, masterGain);
  }
});

document.getElementById('volSlider').addEventListener('input', e => {
  const g = musicNodes.find(n => n instanceof GainNode || (n.gain));
  if(g && g.gain) g.gain.value = parseFloat(e.target.value);
});

document.querySelectorAll('.music-style').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.music-style').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStyle = btn.dataset.style;
    if(musicPlaying) { stopMusic(); document.getElementById('playBtn').click(); }
  });
});
