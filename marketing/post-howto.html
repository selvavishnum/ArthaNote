<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>ArthaNote – How-To Post</title>
<style>
  :root { --p:#065f46; --s:#059669; --a:#d97706; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:1080px; height:1350px; overflow:hidden;
    background:#fff;
    font-family:-apple-system,'Segoe UI','Helvetica Neue',sans-serif;
  }

  /* HEADER */
  .header {
    width:100%; height:90px;
    background:linear-gradient(135deg,var(--p) 0%,var(--s) 100%);
    display:flex; align-items:center; padding:0 56px; gap:16px;
    position:relative;
  }
  .logo-box {
    width:52px;height:52px;background:rgba(255,255,255,0.2);
    border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .header-title { font-size:30px;font-weight:800;color:#fff;letter-spacing:-0.5px; }
  .header-badge {
    margin-left:auto;
    background:rgba(255,255,255,0.2); border-radius:100px;
    padding:6px 18px; font-size:15px; font-weight:600; color:#fff;
    border:1px solid rgba(255,255,255,0.3);
  }

  /* SLIDE CONTAINER */
  .slides-wrap {
    width:1080px;
    height:calc(1350px - 90px - 60px);
    position:relative;
    overflow:hidden;
  }

  .slide {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:60px 80px;
    opacity:0; transform:translateX(60px);
    transition:opacity 0.5s ease, transform 0.5s ease;
    pointer-events:none;
  }
  .slide.active {
    opacity:1; transform:translateX(0);
    pointer-events:auto;
  }
  .slide.exit {
    opacity:0; transform:translateX(-60px);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }

  /* Title slide */
  .slide-intro { background:#fff; justify-content:center; gap:24px; }
  .slide-intro .step-num {
    font-size:18px;font-weight:700;color:var(--s);letter-spacing:2px;text-transform:uppercase;
  }
  .slide-intro .main-title {
    font-size:72px;font-weight:900;color:#0f172a;line-height:1.0;letter-spacing:-2px;
  }
  .slide-intro .main-title .hl { color:var(--s); }
  .slide-intro .sub-title { font-size:28px;color:#64748b;font-weight:400;line-height:1.4; }
  .slide-intro .step-pills {
    display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;
  }
  .step-pill {
    background:#f0fdf4;border:2px solid #bbf7d0;border-radius:100px;
    padding:10px 22px;font-size:18px;font-weight:600;color:var(--p);
  }

  /* Step slides */
  .slide-step { background:#fff; justify-content:center; gap:32px; }
  .step-header { display:flex;align-items:center;gap:24px; }
  .step-circle {
    width:80px;height:80px;border-radius:50%;
    background:linear-gradient(135deg,var(--p) 0%,var(--s) 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:900;color:#fff;
    flex-shrink:0;
    box-shadow:0 8px 24px rgba(5,150,105,0.3);
  }
  .step-label {
    font-size:18px;font-weight:700;color:var(--s);letter-spacing:2px;text-transform:uppercase;
  }
  .step-title { font-size:56px;font-weight:900;color:#0f172a;line-height:1.1;letter-spacing:-1px; }
  .step-icon-big { font-size:80px; line-height:1; }
  .step-body {
    font-size:26px;color:#334155;line-height:1.5;font-weight:400;
    background:#f8fafc;border-left:4px solid var(--s);
    border-radius:0 12px 12px 0;
    padding:24px 28px;
  }
  .step-tips { display:flex;flex-direction:column;gap:14px; }
  .step-tip {
    display:flex;align-items:center;gap:14px;
    background:#f0fdf4;border-radius:12px;padding:16px 20px;
  }
  .tip-dot { width:12px;height:12px;border-radius:50%;background:var(--a);flex-shrink:0; }
  .tip-text { font-size:22px;font-weight:600;color:#0f172a; }

  /* Final slide */
  .slide-final {
    background:linear-gradient(145deg,#022c22 0%,var(--p) 50%,var(--s) 100%);
    justify-content:center; align-items:center; gap:28px; text-align:center;
  }
  .final-emoji { font-size:96px; }
  .final-title { font-size:60px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.1; }
  .final-sub { font-size:26px;color:rgba(255,255,255,0.8);line-height:1.4; }
  .cta-btn {
    background:linear-gradient(135deg,var(--a) 0%,#f59e0b 100%);
    border-radius:100px; padding:22px 60px;
    font-size:30px;font-weight:700;color:#fff;
    box-shadow:0 12px 32px rgba(217,119,6,0.4);
    animation:btnPulse 2s ease infinite;
  }
  .final-url { font-size:22px;color:#86efac;font-weight:600; }

  /* PROGRESS BAR */
  .progress-bar {
    position:fixed;bottom:0;left:0;right:0;height:60px;
    background:#f8fafc;border-top:2px solid #e2e8f0;
    display:flex;align-items:center;padding:0 56px;gap:16px;
  }
  .prog-track {
    flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;
  }
  .prog-fill {
    height:100%;background:linear-gradient(90deg,var(--p) 0%,var(--s) 100%);
    border-radius:4px;transition:width 0.5s ease;
    width:0%;
  }
  .prog-label { font-size:16px;font-weight:600;color:#64748b;white-space:nowrap; }

  @keyframes btnPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
</style>
</head>
<body>
<div class="header">
  <div class="logo-box">📒</div>
  <span class="header-title">ArthaNote</span>
  <span class="header-badge">How To Guide</span>
</div>

<div class="slides-wrap" id="slidesWrap">
  <!-- Slides injected by JS -->
</div>

<div class="progress-bar">
  <span class="prog-label" id="progLabel">Step 1</span>
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  <span class="prog-label" id="progRight">arthanote.com</span>
</div>

<script>
  const p = new URLSearchParams(window.location.search);
  const titleRaw = p.get('title') || 'How to Add Daily Sales';
  const stepsRaw = p.get('steps') || 'Open ArthaNote app on your phone|Tap "Entry" tab at the bottom|Select your shop from the list|Enter amount and choose type: Sale, Expense or Payment|Hit Save — Done! Syncs offline too';

  const steps = stepsRaw.split('|').slice(0,5);
  const stepIcons = ['📱','👆','🏪','✏️','💾','🎉'];
  const stepLabels = ['STEP 1','STEP 2','STEP 3','STEP 4','STEP 5'];

  const wrap = document.getElementById('slidesWrap');

  // Slide 0: Intro
  const intro = document.createElement('div');
  intro.className = 'slide slide-intro active';
  intro.innerHTML = `
    <div class="step-num">📖 Step-by-Step Guide</div>
    <div class="main-title">${titleRaw.replace(/(\S+)$/, '<span class="hl">$1</span>')}</div>
    <div class="sub-title">Follow these easy steps — Tamil Nadu retailers, this is for you!</div>
    <div class="step-pills">
      ${steps.map((s,i)=>`<span class="step-pill">Step ${i+1}</span>`).join('')}
      <span class="step-pill">arthanote.com</span>
    </div>
  `;
  wrap.appendChild(intro);

  // Step slides
  steps.forEach((step,i) => {
    const div = document.createElement('div');
    div.className = 'slide slide-step';
    div.innerHTML = `
      <div class="step-header">
        <div class="step-circle">${i+1}</div>
        <div>
          <div class="step-label">${stepLabels[i] || 'STEP '+(i+1)}</div>
          <div class="step-title">${step.length>40 ? step.substring(0,38)+'…' : step}</div>
        </div>
      </div>
      <div class="step-icon-big">${stepIcons[i] || '⭐'}</div>
      <div class="step-body">${step}</div>
      <div class="step-tips">
        <div class="step-tip"><div class="tip-dot"></div><span class="tip-text">Works online & offline</span></div>
        <div class="step-tip"><div class="tip-dot"></div><span class="tip-text">Tamil & English support</span></div>
      </div>
    `;
    wrap.appendChild(div);
  });

  // Final slide
  const final = document.createElement('div');
  final.className = 'slide slide-final';
  final.innerHTML = `
    <div class="final-emoji">🎉</div>
    <div class="final-title">You're all set!</div>
    <div class="final-sub">உங்கள் கடை Digital ஆனது<br>Start tracking today — it's free!</div>
    <div class="cta-btn">Download FREE →</div>
    <div class="final-url">arthanote.com</div>
  `;
  wrap.appendChild(final);

  // Auto-advance
  const allSlides = wrap.querySelectorAll('.slide');
  const total = allSlides.length;
  let cur = 0;

  const progFill  = document.getElementById('progFill');
  const progLabel = document.getElementById('progLabel');

  function updateProgress() {
    const pct = ((cur+1)/total)*100;
    progFill.style.width = pct+'%';
    if(cur===0) progLabel.textContent = 'Introduction';
    else if(cur===total-1) progLabel.textContent = 'Done!';
    else progLabel.textContent = 'Step '+cur+' of '+steps.length;
  }

  function goTo(n) {
    allSlides[cur].classList.add('exit');
    allSlides[cur].classList.remove('active');
    setTimeout(()=>{ allSlides[cur].classList.remove('exit'); cur=n; allSlides[cur].classList.add('active'); updateProgress(); },420);
  }

  updateProgress();
  setInterval(()=>{ goTo((cur+1)%total); }, 2500);
</script>
</body>
</html>
